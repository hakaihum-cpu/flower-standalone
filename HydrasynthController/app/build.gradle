plugins { id 'com.android.application' }
android {
  namespace 'com.analoglav.hydrasynthcontroller'
  compileSdk 35
  defaultConfig {
    applicationId 'com.analoglav.hydrasynthcontroller'
    minSdk 26
    targetSdk 35
    versionCode 2
    versionName '0.2.0-dev'
  }
  buildTypes {
    release {
      signingConfig signingConfigs.debug
      minifyEnabled false
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
