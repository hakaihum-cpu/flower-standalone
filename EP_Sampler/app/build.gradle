plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.epsampler'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.epmodel.speededitorprobe'
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName '1.21-speed-editor-probe-v01'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}