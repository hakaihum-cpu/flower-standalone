plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.epsampler'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.epmodel'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '1.11-ui-front-fix'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3 -ffast-math'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
