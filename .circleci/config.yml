version: 2.1
parameters:
  run_build:
    type: boolean
    default: false
jobs:
  android_build:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: AMPS isolated static preflight
          command: |
            set -euo pipefail
            test -f AMPS/settings.gradle
            test -f AMPS/app/build.gradle
            # Match proven EP-SAMPLER/HydrasynthController Android target,
            # fail before consuming Gradle time on ExpiredTargetSdkVersion.
            grep -Eq '^[[:space:]]*targetSdk[[:space:]]+35([[:space:]]|$)' AMPS/app/build.gradle
            grep -Eq '^[[:space:]]*compileSdk[[:space:]]+35([[:space:]]|$)' AMPS/app/build.gradle
            test -f AMPS/app/src/main/AndroidManifest.xml
            test -f AMPS/app/src/main/java/com/analoglav/amps/MainActivity.java
            test -f AMPS/app/src/main/java/com/analoglav/amps/AudioBridge.java
            test -f AMPS/app/src/main/java/com/analoglav/amps/TuningProfile.java
            test -f AMPS/app/src/main/java/com/analoglav/amps/usb/UsbAudioDescriptorParser.java
            test -f AMPS/app/src/main/java/com/analoglav/amps/usb/UsbAudioDeviceProbe.java
            test -f AMPS/test/TuningProfileTest.java
            test -f AMPS/test/UsbAudioDescriptorParserTest.java
            test -f AMPS/app/src/main/java/com/analoglav/amps/AmpDsp.java
            test -f AMPS/app/src/main/cpp/AAudioEngine.cpp
            test -f AMPS/app/src/main/cpp/UsbIsoTester.cpp
            test -f AMPS/app/src/main/java/com/analoglav/amps/usb/UsbIsoTester.java
            test -f AMPS/app/src/main/cpp/InputFade.h
            test -f AMPS/test/InputFadeSmoke.cpp
            test -f AMPS/app/src/main/cpp/AmpModel.h
            test -f AMPS/app/src/main/cpp/AudioFifo.h
            test -f AMPS/test/AudioFifoSmoke.cpp
            test -f AMPS/app/src/main/cpp/CMakeLists.txt
            grep -F "externalNativeBuild" AMPS/app/build.gradle
            grep -F "26.1.10909125" AMPS/app/build.gradle
            ! grep -R "com.example.epsampler" AMPS/app/src/main/
            ! grep -R "com.analoglav.hydrasynthcontroller" AMPS/app/src/main/
            sh AMPS/test_core.sh
      - run:
          name: Android SDK 35
          command: |
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" \
              "ndk;26.1.10909125" "cmake;3.22.1"
      - run:
          name: Gradle 8.9
          command: |
            curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
            unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
            echo 'export PATH=/tmp/gradle-8.9/bin:$PATH' >> "$BASH_ENV"
      - run:
          name: Android signing key
          command: |
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
      - run:
          name: Build AMPS APK
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            cd AMPS
            export CMAKE_BUILD_PARALLEL_LEVEL=2
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
            gradle :app:assembleRelease --stacktrace --console=plain --no-daemon --max-workers=2
      - run:
          name: Verify AMPS build artifact
          command: |
            set -euo pipefail
            mkdir -p artifacts
            APK="AMPS/app/build/outputs/apk/release/app-release.apk"
            test -s "$APK"
            cp "$APK" artifacts/AMPS-Android.apk
            sha256sum artifacts/AMPS-Android.apk > artifacts/SHA256.txt
            git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
      - store_artifacts:
          path: artifacts
          destination: amps
workflows:
  manual_android_build:
    when: << pipeline.parameters.run_build >>
    jobs:
      - android_build
