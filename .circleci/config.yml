# MIYAKO native FM-1 development firmware: no KARMA; bounded EUREKA/DREAMY and OSC2 are in progress.
# Manual ONLY: run_build=true. main and older branches never execute this job.
version: 2.1
parameters:
  run_build:
    type: boolean
    default: false

jobs:
  fm1_native_build:
    docker:
      - image: cimg/base:2024.08-22.04
    resource_class: medium
    environment:
      # pipeline.number is a CircleCI compile-time value, NOT a built-in
      # CIRCLE_PIPELINE_NUMBER runtime env var. Pass it explicitly.
      CIRCLE_PIPELINE_NUMBER: << pipeline.number >>
      JIELI_TOOLCHAIN: "/home/circleci/.jieli/toolchain"
      AC79_SDK: "/home/circleci/fw-AC79_AIoT_SDK"
      # fm1-base's default Barlow TTF requires Pillow libraqm for 'tnum'.
      # The upstream-shipped Terminus BDF uses the pixel-font path without
      # any OpenType features/libraqm. Keep this set for ALL build phases.
      X0X_FONTSET: "terminus"
    steps:
      - checkout
      - run:
          name: Verify exact MIYAKO branch and zero KARMA source closure
          command: |
            set -eu
            test "$CIRCLE_BRANCH" = "feature/fm1-three-track-rec-drum-routing-video-slicer-20261110"
            # Reject missing pipeline metadata before media/resource work.
            case "${CIRCLE_PIPELINE_NUMBER:-}" in
              ""|*[!0-9]*) echo "FAIL: CircleCI pipeline.number was not supplied" >&2; exit 1 ;;
            esac
            echo "PASS: CircleCI pipeline #$CIRCLE_PIPELINE_NUMBER"
            # Parse-check EVERY CircleCI run script before any build work.
            python3 fm1/native/tools/check_ci_run_shell.py
            python3 -m compileall -q fm1/native
            python3 -m py_compile fm1/native/verify_standalone.py fm1/native/test_pipeline_contract.py
            python3 fm1/native/verify_standalone.py
            python3 fm1/native/test_pipeline_contract.py
            python3 fm1/native/tools/test_miyako_dynamic_version.py
            python3 fm1/native/tools/build_letter_anim_header.py --out /tmp/mi_letter_preflight.h
            test -s /tmp/mi_letter_preflight.h
            python3 fm1/native/tools/build_ui_anim_header.py --out /tmp/mi_ui_preflight.h
            test -s /tmp/mi_ui_preflight.h
            grep -Fq "#define MI_UI_MOTION_COUNT 100u" /tmp/mi_ui_preflight.h
            grep -Fq "#define MI_UI_ENV_COUNT 90u" /tmp/mi_ui_preflight.h
            grep -Fq "mi_ui_start_maps" /tmp/mi_ui_preflight.h
            python3 fm1/native/tools/test_miyako_resource96.py
            cc -std=c99 -O1 -g -Wall -Wextra -Werror -fno-pie -no-pie \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              fm1/native/mi_control.c fm1/native/test_mi_control.c \
              -o /tmp/mi_control_test
            /tmp/mi_control_test
            cc -std=c99 -O1 -g -Wall -Wextra -Werror -fno-pie -no-pie \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              fm1/native/mi_control.c fm1/native/mi_audio.c fm1/native/mi_fx_dsp.c fm1/native/mi_recorder.c fm1/native/mi_rec_pcm7.c fm1/native/mi_slicer.c fm1/native/mi_piano_set1_engine.c fm1/native/mi_piano_set1_51.c fm1/native/mi_piano_set1_58.c fm1/native/mi_piano_set1_65.c fm1/native/test_mi_audio.c \
              -o /tmp/mi_audio_test
            /tmp/mi_audio_test
            cc -std=c99 -O1 -g -Wall -Wextra -Werror -fno-pie -no-pie \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              fm1/native/mi_fx_dsp.c fm1/native/test_mi_fx_dsp.c \
              -o /tmp/mi_fx_test
            /tmp/mi_fx_test
            cc -std=c99 -O1 -g -Wall -Wextra -Werror -fno-pie -no-pie \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              fm1/native/mi_recorder.c fm1/native/mi_rec_pcm7.c fm1/native/test_mi_recorder.c \
              -o /tmp/mi_recorder_test
            /tmp/mi_recorder_test
            cc -std=c99 -O1 -g -Wall -Wextra -Werror -fno-pie -no-pie \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              fm1/native/mi_recorder.c fm1/native/mi_rec_pcm7.c fm1/native/test_mi_multirec.c \
              -o /tmp/mi_multirec_test
            /tmp/mi_multirec_test
            # 7-bit log-PCM host regression precedes all expensive video processing.
            cc -std=c99 -O1 -g -Wall -Wextra -Werror -fno-pie -no-pie \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              fm1/native/mi_rec_pcm7.c fm1/native/test_mi_rec_pcm7.c \
              -o /tmp/mi_rec_pcm7_test
            /tmp/mi_rec_pcm7_test
            cc -std=c99 -O1 -g -Wall -Wextra -Werror -fno-pie -no-pie \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              fm1/native/mi_slicer.c fm1/native/test_mi_slicer.c \
              -o /tmp/mi_slicer_test
            /tmp/mi_slicer_test
            cc -std=c99 -O1 -g -Wall -Wextra -Werror -fno-pie -no-pie \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              fm1/native/mi_piano_set1_engine.c fm1/native/mi_piano_set1_51.c \
              fm1/native/mi_piano_set1_58.c fm1/native/mi_piano_set1_65.c \
              fm1/native/test_mi_piano_set1.c -o /tmp/mi_piano_set1_test
            /tmp/mi_piano_set1_test
            cc -std=c99 -O1 -g -Wall -Wextra -Werror -fno-pie -no-pie \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              fm1/native/mi_rec_pcm7.c fm1/native/mi_slicer.c \
              fm1/native/test_mi_dsp_stress.c -o /tmp/mi_dsp_stress_test
            /tmp/mi_dsp_stress_test
            cc -std=c99 -O1 -g -Wall -Wextra -Werror -fno-pie -no-pie \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              fm1/native/mi_video.c fm1/native/test_mi_video.c \
              -o /tmp/mi_video_test
            /tmp/mi_video_test
      - run:
          name: Install Python font and media dependencies BEFORE first fm1-base build
          command: |
            set -eu
            sudo apt-get update
            sudo apt-get install -y python3-venv
            python3 -m venv /tmp/mi-video-venv
            /tmp/mi-video-venv/bin/python -m pip install --disable-pip-version-check "Pillow==10.4.0" "numpy==1.26.4"
            /tmp/mi-video-venv/bin/python -c 'from PIL import Image, ImageDraw, ImageFont; import numpy; print("PASS: fm1-base gen_font.py dependencies")'
            /tmp/mi-video-venv/bin/python fm1/native/tools/test_black_frame_guard.py
            /tmp/mi-video-venv/bin/python fm1/native/tools/test_video_palette_natural.py
            /tmp/mi-video-venv/bin/python -m py_compile fm1/native/tools/mi_reference_palette.py
      - run:
          name: Host-compile real MIYAKO app and native FX BEFORE expensive video encoding
          command: |
            set -eu
            git clone https://github.com/charlesvestal/fm1-base.git /tmp/fm1-base
            git -C /tmp/fm1-base checkout --detach e07ebca2dda5fbd3bb40287d1f6083923f9ae999
            git -C /tmp/fm1-base submodule update --init --recursive
            test "$(git -C /tmp/fm1-base rev-parse HEAD)" = "e07ebca2dda5fbd3bb40287d1f6083923f9ae999"
            mkdir -p /tmp/fm1-base/miyako
            cp fm1/native/app.c fm1/native/app.h fm1/native/fm1.toml \
               fm1/native/words.tsv \
               fm1/native/mi_control.c fm1/native/mi_control.h \
               fm1/native/mi_audio.c fm1/native/mi_audio.h \
               fm1/native/mi_video.c fm1/native/mi_video.h \
               fm1/native/mi_fx_dsp.c fm1/native/mi_fx_dsp.h \
               fm1/native/mi_recorder.c fm1/native/mi_recorder.h \
               fm1/native/mi_rec_pcm7.c fm1/native/mi_rec_pcm7.h \
               fm1/native/mi_slicer.c fm1/native/mi_slicer.h \
               fm1/native/mi_piano_set1.h fm1/native/mi_piano_set1_engine.c \
               fm1/native/mi_piano_set1_51.c fm1/native/mi_piano_set1_58.c \
               fm1/native/mi_piano_set1_65.c \
               fm1/native/mi_memory.h fm1/native/mi_resource_media.h \
               /tmp/fm1-base/miyako/
            test -s /tmp/fm1-base/miyako/words.tsv
            grep -q '^# url: https://' /tmp/fm1-base/miyako/words.tsv
            # Materialize the 72-frame user-supplied SUB animation before
            # either host or target builds; the exact source SHA is verified.
            python3 fm1/native/tools/build_letter_anim_header.py \
              --out /tmp/fm1-base/miyako/mi_letter_anim.h
            test -s /tmp/fm1-base/miyako/mi_letter_anim.h
            python3 fm1/native/tools/build_ui_anim_header.py \
              --out /tmp/fm1-base/miyako/mi_ui_media.h
            test -s /tmp/fm1-base/miyako/mi_ui_media.h
            grep -Fq "#define MI_UI_MOTION_COUNT 100u" /tmp/fm1-base/miyako/mi_ui_media.h
            grep -Fq "#define MI_UI_ENV_COUNT 90u" /tmp/fm1-base/miyako/mi_ui_media.h
            # Standard CRC-protected res.bin, 96x96 original-source images.
            # 279936 + 32-byte header fits in 69 sectors; saved data untouched.
            python3 fm1/native/tools/pack_miyako_resource.py \
              /tmp/fm1-base/miyako/miyako_media.bin
            test "$(stat -c %s /tmp/fm1-base/miyako/miyako_media.bin)" -eq 279936
            # CircleCI pipeline number drives the running UI version, OTA
            # loader and FWSC product marker; fixed 938 is forbidden.
            python3 fm1/native/tools/set_miyako_product_id.py --base /tmp/fm1-base
            test -s /tmp/fm1_product_id.txt
            product="$(cat /tmp/fm1_product_id.txt)"
            grep -Fq "PRODUCT = prefix + \"${product#FM-1_9}\"" /tmp/fm1-base/tools/build.py
            grep -Fq "#define APP_VERSION \"$product\"" /tmp/fm1-base/miyako/app.h
            # Fail early on fonts: never reach the C build with untested
            # Pillow Raqm or a missing upstream bitmap asset.
            test -s /tmp/fm1-base/assets/fonts/ter-u12n.bdf
            test -s /tmp/fm1-base/assets/fonts/ter-u16b.bdf
            test "$X0X_FONTSET" = "terminus"
            /tmp/mi-video-venv/bin/python /tmp/fm1-base/tools/gen_font.py \
              /tmp/mi_font_preflight.h
            test -s /tmp/mi_font_preflight.h
            # Run the real upstream fm1-base MMIO / BSP policy now,
            # not a regex approximation after hours of video optimisation.
            python3 fm1/native/tools/run_upstream_platform_checks.py \
              --platform /tmp/fm1-base --app /tmp/fm1-base/miyako
            python3 fm1/native/tools/compile_only_media_stub.py \
              /tmp/fm1-base/miyako/mi_effects_vq_frames.h
            python3 fm1/native/tools/compile_only_media_stub.py \
              /tmp/fm1-base/miyako/mi_eureka_vq_frames.h
            /tmp/mi-video-venv/bin/python /tmp/fm1-base/tools/build.py /tmp/fm1-base/miyako --host
            test -x /tmp/fm1-base/miyako/build/host/miyako_host
            test "$(grep -c 'MI_EFFECTS_MEDIA_PREFLIGHT_STUB 1' \
              /tmp/fm1-base/miyako/mi_effects_vq_frames.h)" -eq 1
            test "$(grep -c 'MI_EUREKA_MEDIA_PREFLIGHT_STUB 1' \
              /tmp/fm1-base/miyako/mi_eureka_vq_frames.h)" -eq 1
            # Execute all three real FM-1 host scripts BEFORE image VQ.
            # Stubbed frame data checks the control/audio flow only.
            # These temporary files must never enter final artifacts.
            mkdir -p /tmp/miyako-host-preflight
            /tmp/fm1-base/miyako/build/host/miyako_host \
              fm1/native/host_smoke.txt /tmp/miyako-host-preflight
            /tmp/fm1-base/miyako/build/host/miyako_host \
              fm1/native/host_fx_preview.txt /tmp/miyako-host-preflight
            /tmp/fm1-base/miyako/build/host/miyako_host \
              fm1/native/host_eureka_preview.txt /tmp/miyako-host-preflight
            # Test the real host audio already rendered above. Source VQ
            # image placeholders do not affect the native sound processing.
            test -s /tmp/miyako-host-preflight/MIYAKO_FX_PREVIEW.wav
            test -s /tmp/miyako-host-preflight/MIYAKO_EUREKA_AUDIO.wav
            # Compiler-only media headers contain ZERO pixels by design.
            # Validate image visibility only in the later REAL-VQ host run.
            python3 fm1/native/tools/check_host_wav.py \
              /tmp/miyako-host-preflight/MIYAKO_FX_PREVIEW.wav
            python3 fm1/native/tools/check_eureka_wav.py \
              /tmp/miyako-host-preflight/MIYAKO_EUREKA_AUDIO.wav
      - run:
          name: Install pinned JieLi compiler and minimum AC79 packaging inputs
          command: |
            set -eu
            sudo apt-get update
            sudo apt-get install -y xz-utils libtinfo5
            # Exact, hash-verified JieLi pi32v2 release. The upstream unpinned
            # curl-to-tar endpoint timed out in #267; do not invoke it.
            sh fm1/native/tools/install_jieli_toolchain.sh /home/circleci/.jieli
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$AC79_SDK"
            test -x "$JIELI_TOOLCHAIN/pi32v2/bin/clang"
            test -f "$AC79_SDK/cpu/wl82/tools/uboot.boot"
            test -f "$AC79_SDK/cpu/wl82/tools/cfg_tool.bin"
            test -f "$AC79_SDK/cpu/wl82/tools/cfg/eq_cfg_hw.bin"
      - run:
          name: Verify freestanding MIYAKO C with the actual JieLi target compiler BEFORE video conversion
          command: |
            set -eu
            CLC="$JIELI_TOOLCHAIN/pi32v2/bin/clang"
            test -x "$CLC"
            # All four independent MIYAKO native DSP / video objects.
            # Same CPU, FPU, standard, builtin and optimization policy as fm1-base.
            for unit in mi_fx_dsp.c mi_audio.c mi_recorder.c mi_rec_pcm7.c mi_slicer.c mi_piano_set1_engine.c mi_piano_set1_51.c mi_piano_set1_58.c mi_piano_set1_65.c mi_control.c mi_video.c; do
              "$CLC" -fsyntax-only -std=c99 -Os -mcpu=r3 -mfprev1 -ffp-contract=off \
                -fno-builtin -Wall -Werror=implicit-function-declaration \
                -I /tmp/fm1-base/miyako -I /tmp/fm1-base/include \
                "/tmp/fm1-base/miyako/$unit"
              echo "PASS: JieLi pi32v2 freestanding $unit"
            done
            python3 fm1/native/verify_standalone.py
      - run:
          name: Exercise real FM-1 target compile, link, and all upstream policy checks before costly video VQ
          command: |
            set -eu
            test -s /tmp/fm1-base/miyako/mi_effects_vq_frames.h
            grep -q 'MI_EFFECTS_MEDIA_PREFLIGHT_STUB' /tmp/fm1-base/miyako/mi_effects_vq_frames.h
            grep -q 'MI_EUREKA_MEDIA_PREFLIGHT_STUB' /tmp/fm1-base/miyako/mi_eureka_vq_frames.h
            /tmp/mi-video-venv/bin/python /tmp/fm1-base/tools/build.py /tmp/fm1-base/miyako
            test -s /tmp/fm1-base/miyako/build/miyako.fwsc
            # Generated-media stub is intentionally a type checker ONLY.
            # Do not preserve or publish an installable file containing it.
            rm -rf /tmp/fm1-base/miyako/build
            test ! -e /tmp/fm1-base/miyako/build/miyako.fwsc
      - run:
          name: Reconstruct all 144 original MIYAKO EFFECTS source frames
          command: |
            set -eu
            python3 scripts/materialize_effects_video_pack.py
            test -s Resources/effects_video_frames.pack
            mkdir -p fm1-dist
            /tmp/mi-video-venv/bin/python -c 'from PIL import Image; import numpy'
            export OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2
            /tmp/mi-video-venv/bin/python fm1/native/tools/pack_effects_vq_candidate.py \
              Resources/effects_video_frames.pack fm1/native/mi_effects_vq_frames.h \
              --preview fm1-dist/EFFECTS_VQ_PREVIEW.png
            grep -q 'MI_EFFECTS_ASSET_COUNT 144u' fm1/native/mi_effects_vq_frames.h
            test -s fm1-dist/EFFECTS_VQ_PREVIEW.png
      - run:
          name: Reconstruct all 576 original MIYAKO EUREKA frames
          command: |
            set -eu
            python3 scripts/materialize_miyako_eureka_video.py
            test -s Resources/miyako_eureka_frames.pack
            export OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2
            /tmp/mi-video-venv/bin/python fm1/native/tools/pack_eureka_vq_candidate.py \
              Resources/miyako_eureka_frames.pack fm1/native/mi_eureka_vq_frames.h \
              --preview fm1-dist/EUREKA_VQ_PREVIEW.png
            grep -q 'MI_EUREKA_ASSET_COUNT 576u' fm1/native/mi_eureka_vq_frames.h
            test -s fm1-dist/EUREKA_VQ_PREVIEW.png
      - run:
          name: Verify all 720 EFFECTS and EUREKA original frames by C decoder CRC
          command: |
            set -eu
            cc -std=c99 -O2 -Wall -Wextra -Werror \
              -I fm1/native fm1/native/test_media_crc.c \
              -o /tmp/mi_media_crc_test
            /tmp/mi_media_crc_test
      - run:
          name: Compile FM-1 native platform host simulator and exercise UI, MIDI, persistent controls
          command: |
            set -eu
            test "$(git -C /tmp/fm1-base rev-parse HEAD)" = "e07ebca2dda5fbd3bb40287d1f6083923f9ae999"
            cp fm1/native/mi_effects_vq_frames.h fm1/native/mi_eureka_vq_frames.h /tmp/fm1-base/miyako/
            if grep -q 'MI_EFFECTS_MEDIA_PREFLIGHT_STUB' /tmp/fm1-base/miyako/mi_effects_vq_frames.h || \
               grep -q 'MI_EUREKA_MEDIA_PREFLIGHT_STUB' /tmp/fm1-base/miyako/mi_eureka_vq_frames.h; then
              echo "FAIL: fake compiler-only media must never reach FWSC" >&2
              exit 1
            fi
            /tmp/mi-video-venv/bin/python /tmp/fm1-base/tools/build.py /tmp/fm1-base/miyako --host
            test -x /tmp/fm1-base/miyako/build/host/miyako_host
            /tmp/fm1-base/miyako/build/host/miyako_host fm1/native/host_smoke.txt fm1-dist
            /tmp/fm1-base/miyako/build/host/miyako_host fm1/native/host_fx_preview.txt fm1-dist
            /tmp/fm1-base/miyako/build/host/miyako_host fm1/native/host_eureka_preview.txt fm1-dist
            test -s fm1-dist/MIYAKO_HOME.png
            test -s fm1-dist/MIYAKO_FX.png
            test -s fm1-dist/MIYAKO_EFFECTS_VIDEO.png
            test -s fm1-dist/MIYAKO_ENV.png
            test -s fm1-dist/MIYAKO_GLOBAL.png
            test -s fm1-dist/MIYAKO_GLOBAL_MIDI.png
            test -s fm1-dist/MIYAKO_SAVE_LOAD.png
            test -s fm1-dist/MIYAKO_LFO.png
            /tmp/mi-video-venv/bin/python fm1/native/tools/check_ui_sprite_layout.py \
              fm1-dist/MIYAKO_ENV.png fm1-dist/MIYAKO_LFO.png
            test -s fm1-dist/MIYAKO_ARP.png
            test -s fm1-dist/MIYAKO_EUREKA_VIDEO.png
            test -s fm1-dist/MIYAKO_PHOTO_RESOURCE_RESTORED.png
            /tmp/mi-video-venv/bin/python fm1/native/tools/check_noresource_display.py \
              fm1-dist/MIYAKO_NO_RESOURCE_SEL.png \
              fm1-dist/MIYAKO_NO_RESOURCE_FX.png \
              fm1-dist/MIYAKO_PHOTO_RESOURCE_RESTORED.png \
              fm1-dist/MIYAKO_PHOTO_RESOURCE.png
            test -s fm1-dist/MIYAKO_FX_DUAL.png
            test -s fm1-dist/MIYAKO_OSC_SILENCE.png
            test -s fm1-dist/MIYAKO_OSC_LIVE_SINE.png
            test -s fm1-dist/MIYAKO_OSC_SUB_0.png
            test -s fm1-dist/MIYAKO_OSC_SUB_127.png
            # Source legibility gate checks subject silhouettes, frame change,
            # and proper 2-colour pixels in the actual host LCD screenshots.
            /tmp/mi-video-venv/bin/python fm1/native/tools/check_letter_quality.py \
              fm1-dist/MIYAKO_OSC_SUB_0.png \
              fm1-dist/MIYAKO_OSC_SUB_127.png
            test -s fm1-dist/MIYAKO_NORMAL_SEL_ACTIVE.png
            test -s fm1-dist/MIYAKO_NORMAL_SEL_RETURN.png
            test -s fm1-dist/MIYAKO_NORMAL_SEL_FROM_FX.png
            test -s fm1-dist/MIYAKO_FX_DREAMY_LARGE.png
            test -s fm1-dist/MIYAKO_FX_EUREKA_LARGE.png
            test -s fm1-dist/MIYAKO_RECORDER.png
            test -s fm1-dist/MIYAKO_RECORDER_PLAY.png
            test -s fm1-dist/MIYAKO_EUREKA_AUDIO.wav
            test -s fm1-dist/MIYAKO_FX_PREVIEW.wav
            test "$(stat -c %s fm1-dist/MIYAKO_FX_PREVIEW.wav)" -gt 10000
            /tmp/mi-video-venv/bin/python fm1/native/tools/check_host_wav.py fm1-dist/MIYAKO_FX_PREVIEW.wav
            /tmp/mi-video-venv/bin/python fm1/native/tools/check_eureka_wav.py fm1-dist/MIYAKO_EUREKA_AUDIO.wav
      - run:
          name: Link and validate installable native MIYAKO FM-1 DEVELOPMENT FWSC
          command: |
            set -eu
            export JIELI_TOOLCHAIN AC79_SDK
            /tmp/mi-video-venv/bin/python /tmp/fm1-base/tools/build.py /tmp/fm1-base/miyako
            test -s /tmp/fm1-base/miyako/build/miyako.bin
            test -s /tmp/fm1-base/miyako/build/loader/ota.bin
            test -s /tmp/fm1-base/miyako/build/miyako.fwsc
            /tmp/mi-video-venv/bin/python fm1/native/tools/verify_fwsc.py \
              /tmp/fm1-base/miyako/build/miyako.fwsc \
              /tmp/fm1-base/miyako/build/miyako.bin \
              /tmp/fm1-base/miyako/build/loader/ota.bin \
              --base /tmp/fm1-base --product "$(cat /tmp/fm1_product_id.txt)"
            cp /tmp/fm1-base/miyako/build/miyako.fwsc fm1-dist/MIYAKO-FM1-NATIVE-DEV.fwsc
            # The matching upstream resource installer uses this exact stem.
            test -s /tmp/fm1-base/miyako/build/miyako-res.bin
            cp /tmp/fm1-base/miyako/build/miyako-res.bin \
              fm1-dist/MIYAKO-FM1-NATIVE-DEV-res.bin
            test "$(stat -c %s fm1-dist/MIYAKO-FM1-NATIVE-DEV-res.bin)" -eq 279968
            printf '%s\n' \
              'MIYAKO FM-1 NATIVE DEVELOPMENT FIRMWARE' \
              'Built without the KARMA application and DSP.' \
              'REEL, DREAMY, DELAY, REVERB and CHORUS are native FM-1 DSP implementations.' \
              'Original 144 EFFECTS and 576 EUREKA source frames are 16-colour VQ.' \
              'To see all 628 photo tiles, install the matching MIYAKO-FM1-NATIVE-DEV-res.bin with the existing fm1-base resource installer; FWSC-only updates do not include photos.' \
              'The 628 user photo frames retain their real RGB colours (including sepia sunsets) with 24 per-clip 16-colour palettes in the unchanged stock VQ format.' \
              'The exact matching 279968-byte MIYAKO-FM1-NATIVE-DEV-res.bin MUST be installed together with this FWSC; old image resources, even when the same size, have different VQ codebooks and are rejected. Use the original resource installer.' \
              'RECORDER: three independent 2/4-bar 56-byte log-PCM loop tracks, with per-track overdub, mute, pan, pitch, in/out and level. 2 bars when external MIDI Clock is active.' \
              'SEQ short press: RECORDER (repeat to switch LOOP parameters/MIX page); PRESET selects LOOP 1/2/3. SEQ hold (650ms): independent 4-track FMDrum step sequencer.' \
              '16 white keys toggle steps 1-16. K1 track, K2 play/stop, K3 direction, K4 length 8-16.' \
              'SEQ MIDI input: F8 24-PPQN Clock, six clocks per step, FA Start, FB Continue, FC Stop. Internal BPM if clock is lost.' \
              'Selected REC track Pitch responds to MIDI CC21 on any channel. Values map to existing semitone choices -12, -7, -5, 0, +5, +7, +12.' \
              'GLOBAL: K1 MIDI note channel 1-16, K2 SEQ Clock INTERNAL/MIDI, K3 preset slot 1-4, K4 clockwise twice loads the preset.' \
              'SAVE: K1 slot, K2 SAVE/LOAD, physical SAVE key twice confirms the action. Four independently stored flash presets.' \
              'FMDrum live keyboard is recorded by RECORDER. Automatic step-sequencer FMDrum bypasses the recorder capture bus and remains audible on the final output.' \
              'SLICER FX (RATE/RND/WET) processes the final stereo mix including all LOOP tracks and FMDrum. RECORDER MIDI Clock capture behavior is preserved.' \
              'PIANO: Wingie2 SET1 only, flash-backed MIDI roots 51/58/65, three 0.8-second 12kHz mono samples. PIANO keyboard/MIDI enters the normal FX and REC capture bus.' \
              'This is NOT the complete approved MIYAKO port. Physical FM-1 verification is pending.' \
              > fm1-dist/README_BEFORE_INSTALL.txt
            (cd fm1-dist && sha256sum *.fwsc *-res.bin > SHA256SUMS)
      - store_artifacts:
          path: fm1-dist
          destination: fm1

workflows:
  fm1_manual:
    when: << pipeline.parameters.run_build >>
    jobs:
      - fm1_native_build:
          filters:
            branches:
              only: feature/fm1-three-track-rec-drum-routing-video-slicer-20261110
