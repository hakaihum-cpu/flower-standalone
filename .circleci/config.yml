version: 2.1

parameters:
  run_build:
    type: boolean
    default: false

jobs:
  android_build:
    docker:
      - image: cimg/android:2026.08.1-node
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Static preflight before Android SDK or Gradle work
          command: |
            set -euo pipefail
            python3 -m py_compile pose_walk/scripts/static_preflight.py
            python3 pose_walk/scripts/static_preflight.py
            node --check pose_walk/tests/smoke_test.js
            node pose_walk/tests/smoke_test.js

      - restore_cache:
          keys:
            - pose-walk-gradle-8-9-v1-

      - run:
          name: Prepare Android SDK 35 and pinned Gradle 8.9
          command: |
            set -euo pipefail
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-35" \
              "build-tools;35.0.0"
            if [ ! -x "$HOME/gradle-8.9/bin/gradle" ]; then
              curl -fsSL --retry 3 --connect-timeout 30 \
                https://services.gradle.org/distributions/gradle-8.9-bin.zip \
                -o /tmp/pose-walk-gradle-8.9.zip
              unzip -q /tmp/pose-walk-gradle-8.9.zip -d "$HOME"
            fi
            "$HOME/gradle-8.9/bin/gradle" --version

      - run:
          name: Build POSE WALK debug APK
          no_output_timeout: 30m
          command: |
            set -u
            mkdir -p android-artifact
            set +e
            "$HOME/gradle-8.9/bin/gradle" -p pose_walk :app:assembleDebug \
              --stacktrace --console=plain --no-daemon --max-workers=2 \
              2>&1 | tee android-artifact/gradle-build.log
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ] && [ ! -s pose_walk/app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "Gradle exited successfully but no debug APK was produced." >> android-artifact/gradle-build.log
              STATUS=41
            fi
            echo "$STATUS" > android-artifact/gradle-exit-code.txt
            tail -n 180 android-artifact/gradle-build.log || true
            exit 0

      - save_cache:
          key: pose-walk-gradle-8-9-v1-{{ epoch }}
          paths:
            - ~/.gradle/caches
            - ~/gradle-8.9

      - run:
          name: Collect POSE WALK APK and build provenance
          when: always
          command: |
            set -euo pipefail
            mkdir -p android-artifact
            git rev-parse HEAD > android-artifact/SOURCE_COMMIT.txt
            APK=pose_walk/app/build/outputs/apk/debug/app-debug.apk
            if [ -s "$APK" ]; then
              cp "$APK" android-artifact/POSE-WALK-debug.apk
              sha256sum android-artifact/POSE-WALK-debug.apk > android-artifact/SHA256.txt
              echo "[PASS] POSE-WALK-debug.apk collected"
            else
              echo "Debug APK not available" > android-artifact/NO_APK.txt
            fi

      - store_artifacts:
          path: android-artifact
          destination: android-artifact

      - run:
          name: Propagate build result
          when: always
          command: |
            set -euo pipefail
            if [ ! -s android-artifact/gradle-exit-code.txt ]; then
              echo "Build exit status missing"
              exit 97
            fi
            STATUS="$(cat android-artifact/gradle-exit-code.txt)"
            if [ "$STATUS" != "0" ]; then
              echo "Build FAILED, Gradle exit status: $STATUS"
              exit "$STATUS"
            fi
            test -s android-artifact/POSE-WALK-debug.apk
            echo "[PASS] POSE WALK debug APK packaged"

workflows:
  manual_android_build:
    when: << pipeline.parameters.run_build >>
    jobs:
      - android_build
