version: 2.1

parameters:
  run_build:
    type: boolean
    default: false

jobs:
  android_build:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Static dependency audit
          command: |
            python3 scripts/static_dependency_audit.py

      - restore_cache:
          keys:
            - juce-9.0.2-projucer-v1
            - gradle-flower-v1-

      - run:
          name: Install Projucer Linux dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              git cmake ninja-build \
              libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
              libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev \
              libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
              libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - run:
          name: Prepare JUCE 9.0.2 and Projucer
          command: |
            set -euo pipefail
            if [ ! -d JUCE/.git ]; then
              rm -rf JUCE
              git clone --depth 1 --branch 9.0.2 https://github.com/juce-framework/JUCE.git JUCE
            fi

            PROJUCER="$(find JUCE/build -type f -name Projucer -perm -111 2>/dev/null | head -n 1 || true)"
            if [ -z "$PROJUCER" ]; then
              cmake -S JUCE -B JUCE/build \
                -DJUCE_BUILD_EXTRAS=ON \
                -DJUCE_BUILD_EXAMPLES=OFF \
                -DCMAKE_BUILD_TYPE=Release
              cmake --build JUCE/build --target Projucer -j2
              PROJUCER="$(find JUCE/build -type f -name Projucer -perm -111 | head -n 1)"
            fi
            test -n "$PROJUCER"
            echo "export PROJUCER=$PROJUCER" >> "$BASH_ENV"

      - save_cache:
          key: juce-9.0.2-projucer-v1
          paths:
            - JUCE

      - run:
          name: Install Android SDK components
          command: |
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "ndk;26.1.10909125"

      - run:
          name: Generate Android Studio project
          command: |
            set -euo pipefail
            "$PROJUCER" --resave FLOWER_Standalone.jucer
            test -d Builds/Android
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > Builds/Android/local.properties

      - run:
          name: Create Android debug signing keystore
          command: |
            set -euo pipefail
            mkdir -p "$HOME/.android"
            rm -f "$HOME/.android/debug.keystore"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000

      - restore_cache:
          keys:
            - gradle-flower-v1-

      - run:
          name: Build optimized installable APK with native diagnostics
          no_output_timeout: 30m
          command: |
            set -u
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
            export CMAKE_BUILD_PARALLEL_LEVEL=2
            export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -XX:ActiveProcessorCount=2"
            mkdir -p android-artifact
            LOG="$PWD/android-artifact/gradle-build.log"
            EXIT_FILE="$PWD/android-artifact/gradle-exit-code.txt"

            {
              echo "[diagnostic] start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "[diagnostic] nproc=$(nproc)"
              echo "[diagnostic] processors_online=$(getconf _NPROCESSORS_ONLN || true)"
              echo "[diagnostic] CMAKE_BUILD_PARALLEL_LEVEL=$CMAKE_BUILD_PARALLEL_LEVEL"
              echo "[diagnostic] uname=$(uname -a)"
              java -version 2>&1
              free -m || true
              df -h || true
              ulimit -a || true
              if [ -r /sys/fs/cgroup/memory.max ]; then
                echo "[diagnostic] cgroup memory.max=$(cat /sys/fs/cgroup/memory.max)"
              fi
              if [ -r /sys/fs/cgroup/memory.current ]; then
                echo "[diagnostic] cgroup memory.current=$(cat /sys/fs/cgroup/memory.current)"
              fi
            } | tee "$LOG"

            cd Builds/Android
            chmod +x gradlew

            set +e
            ./gradlew assembleRelease --stacktrace --info --console=plain --no-daemon --max-workers=2 >> "$LOG" 2>&1 &
            GRADLE_PID=$!
            echo "[diagnostic] gradle_pid=$GRADLE_PID" | tee -a "$LOG"

            while kill -0 "$GRADLE_PID" 2>/dev/null; do
              {
                echo "[heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                free -m || true
                if [ -r /sys/fs/cgroup/memory.current ]; then
                  echo "[heartbeat] cgroup memory.current=$(cat /sys/fs/cgroup/memory.current)"
                fi
                CLANG_COUNT="$(ps -eo comm= | grep -Ec '^clang(\+\+)?$' || true)"
                echo "[heartbeat] clang_processes=$CLANG_COUNT"
                ps -eo pid,ppid,%cpu,%mem,rss,vsz,comm --sort=-rss | head -n 16 || true

                if [ "$CLANG_COUNT" -gt 4 ]; then
                  echo "[guard] excessive native parallelism detected: $CLANG_COUNT clang processes" | tee -a "$LOG"
                  kill "$GRADLE_PID" 2>/dev/null || true
                  break
                fi

                if [ -r /sys/fs/cgroup/memory.current ]; then
                  CURRENT_MEMORY="$(cat /sys/fs/cgroup/memory.current)"
                  if [ "$CURRENT_MEMORY" -gt 4026531840 ]; then
                    echo "[guard] cgroup memory exceeded 3.75 GiB: $CURRENT_MEMORY" | tee -a "$LOG"
                    kill "$GRADLE_PID" 2>/dev/null || true
                    break
                  fi
                fi
              } | tee -a "$LOG"
              sleep 30
            done

            wait "$GRADLE_PID"
            STATUS=$?
            set -e

            echo "$STATUS" | tee "$EXIT_FILE"
            echo "[diagnostic] gradle_exit=$STATUS" | tee -a "$LOG"
            echo "[diagnostic] final memory/process snapshot" | tee -a "$LOG"
            free -m | tee -a "$LOG" || true
            if [ -r /sys/fs/cgroup/memory.events ]; then
              cat /sys/fs/cgroup/memory.events | tee -a "$LOG" || true
            fi
            ps -eo pid,ppid,%cpu,%mem,rss,vsz,comm --sort=-rss | head -n 20 | tee -a "$LOG" || true

            echo "[diagnostic] last 250 Gradle log lines:"
            tail -n 250 "$LOG" || true

            # Do not fail this step. Artifact collection and the explicit
            # result-propagation step below must run even when Gradle fails.
            exit 0

      - save_cache:
          key: gradle-flower-v1-{{ epoch }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - run:
          name: Collect build diagnostics and APK
          when: always
          command: |
            set -euo pipefail
            mkdir -p android-artifact
            git rev-parse HEAD | tee android-artifact/SOURCE_COMMIT.txt

            APK="$(find Builds/Android -type f -name '*.apk' | grep -E '/release/|release\.apk$' | head -n 1 || true)"
            if [ -n "$APK" ]; then
              cp "$APK" android-artifact/Flower-Standalone-Android.apk
              sha256sum android-artifact/Flower-Standalone-Android.apk \
                | tee android-artifact/SHA256.txt
            else
              echo "No release APK produced." | tee android-artifact/NO_APK.txt
            fi

      - store_artifacts:
          path: android-artifact
          destination: android-artifact

      - run:
          name: Propagate Gradle build result
          when: always
          command: |
            set -euo pipefail
            if [ ! -f android-artifact/gradle-exit-code.txt ]; then
              echo "Gradle exit code file is missing; runner may have terminated unexpectedly."
              exit 97
            fi
            STATUS="$(cat android-artifact/gradle-exit-code.txt)"
            echo "Gradle exit code: $STATUS"
            exit "$STATUS"

workflows:
  manual_android_build:
    when: << pipeline.parameters.run_build >>
    jobs:
      - android_build
