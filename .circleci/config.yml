version: 2.1
parameters:
  run_build:
    type: boolean
    default: false
jobs:
  android_build:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Hydrasynth isolated static preflight
          command: |
            set -euo pipefail
            test -f HydrasynthController/settings.gradle
            test -f HydrasynthController/app/build.gradle
            test -f HydrasynthController/app/src/main/java/com/analoglav/hydrasynthcontroller/MainActivity.java
            test -f HydrasynthController/app/src/main/java/com/analoglav/hydrasynthcontroller/NrpnEncoder.java
            sh HydrasynthController/test_core.sh
            ! grep -R "com.example.epsampler" HydrasynthController/app/src/main/
      - run:
          name: Android SDK 35
          command: |
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - run:
          name: Gradle 8.9
          command: |
            curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
            unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
            echo 'export PATH=/tmp/gradle-8.9/bin:$PATH' >> "$BASH_ENV"
      - run:
          name: Android signing key
          command: |
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
      - run:
          name: Build HYDRA DOT APK
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            cd HydrasynthController
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
            gradle :app:assembleRelease --stacktrace --console=plain --no-daemon --max-workers=2
      - run:
          name: Verify HYDRA DOT build artifact
          command: |
            set -euo pipefail
            mkdir -p artifacts
            APK="HydrasynthController/app/build/outputs/apk/release/app-release.apk"
            test -s "$APK"
            cp "$APK" artifacts/HydrasynthController-Android.apk
            sha256sum artifacts/HydrasynthController-Android.apk > artifacts/SHA256.txt
            git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
      - store_artifacts:
          path: artifacts
          destination: hydrasynth-controller
workflows:
  manual_android_build:
    when: << pipeline.parameters.run_build >>
    jobs:
      - android_build
