version: 2.1

parameters:
  run_build:
    type: boolean
    default: false

jobs:
  android_build:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Materialize exact supplied frame pack
          command: python3 scripts/materialize_frame_pack.py

      - run:
          name: Static dependency audit
          command: python3 scripts/static_dependency_audit.py

      - restore_cache:
          keys:
            - juce-9.0.2-projucer-chordfx-v1
            - gradle-chordfx-v1-

      - run:
          name: Install Projucer dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y git cmake ninja-build libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - run:
          name: Prepare JUCE 9.0.2 and Projucer
          command: |
            set -euo pipefail
            if [ ! -d JUCE/.git ]; then
              rm -rf JUCE
              git clone --depth 1 --branch 9.0.2 https://github.com/juce-framework/JUCE.git JUCE
            fi
            PROJUCER="$(find JUCE/build -type f -name Projucer -perm -111 2>/dev/null | head -n 1 || true)"
            if [ -z "$PROJUCER" ]; then
              cmake -S JUCE -B JUCE/build -DJUCE_BUILD_EXTRAS=ON -DJUCE_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
              cmake --build JUCE/build --target Projucer -j2
              PROJUCER="$(find JUCE/build -type f -name Projucer -perm -111 | head -n 1)"
            fi
            test -n "$PROJUCER"
            echo "export PROJUCER=$PROJUCER" >> "$BASH_ENV"

      - save_cache:
          key: juce-9.0.2-projucer-chordfx-v1
          paths: [JUCE]

      - run:
          name: Install Android SDK components
          command: |
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - run:
          name: Generate Android project
          command: |
            set -euo pipefail
            "$PROJUCER" --resave RealtimeChordFX_Standalone.jucer
            test -d Builds/Android
            python3 scripts/patch_android_native_parallelism.py Builds/Android/app/build.gradle
            grep -F -- '-DCMAKE_JOB_POOLS:STRING=compile=2;link=1' Builds/Android/app/build.gradle
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > Builds/Android/local.properties

      - run:
          name: Create debug signing keystore
          command: |
            set -euo pipefail
            mkdir -p "$HOME/.android"
            rm -f "$HOME/.android/debug.keystore"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - restore_cache:
          keys: [gradle-chordfx-v1-]

      - run:
          name: Build release APK with diagnostics
          no_output_timeout: 30m
          command: |
            set -u
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
            export CMAKE_BUILD_PARALLEL_LEVEL=2
            export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -XX:ActiveProcessorCount=2"
            mkdir -p android-artifact
            LOG="$PWD/android-artifact/gradle-build.log"
            EXIT="$PWD/android-artifact/gradle-exit-code.txt"
            cd Builds/Android
            chmod +x gradlew
            set +e
            ./gradlew assembleRelease --stacktrace --info --console=plain --no-daemon --max-workers=2 > "$LOG" 2>&1 &
            PID=$!
            while kill -0 "$PID" 2>/dev/null; do
              echo "[heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$LOG"
              sleep 30
            done
            wait "$PID"; STATUS=$?
            set -e
            echo "$STATUS" > "$EXIT"
            tail -n 250 "$LOG" || true
            exit 0

      - save_cache:
          key: gradle-chordfx-v1-{{ epoch }}
          paths: [~/.gradle/caches, ~/.gradle/wrapper]

      - run:
          name: Collect APK and identity
          when: always
          command: |
            set -euo pipefail
            mkdir -p android-artifact
            git rev-parse HEAD | tee android-artifact/SOURCE_COMMIT.txt
            APK="$(find Builds/Android -type f -name '*.apk' | grep -E '/release/|release\.apk$' | head -n 1 || true)"
            if [ -n "$APK" ]; then
              cp "$APK" android-artifact/RealtimeChordFX-Android.apk
              sha256sum android-artifact/RealtimeChordFX-Android.apk | tee android-artifact/SHA256.txt
            else
              echo "No release APK produced." | tee android-artifact/NO_APK.txt
            fi

      - store_artifacts:
          path: android-artifact
          destination: diagnostics

      - run:
          name: Propagate Gradle result
          when: always
          command: |
            set -euo pipefail
            test -f android-artifact/gradle-exit-code.txt || exit 97
            STATUS="$(cat android-artifact/gradle-exit-code.txt)"
            exit "$STATUS"

workflows:
  manual_android_build:
    when: << pipeline.parameters.run_build >>
    jobs:
      - android_build