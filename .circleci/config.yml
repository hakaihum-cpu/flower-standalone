# ANDROIDAPP (flower-standalone) AN-66 one-off CircleCI trial.\n# The MIYAKO source stays private in Vstplugin; this branch stores CI config only.
# A normal push creates no build: run_build must explicitly be true.
# Trigger from only feature/AN-66-miyako-circleci-trial in the existing androidapp project.\n# Do NOT run EP-Sampler on this trial branch. No main/Golden Baseline writes.
version: 2.1
parameters:
  run_build:
    type: boolean
    default: false

jobs:
  manual_android_build:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: medium
    working_directory: ~/project/miyako-source
    steps:
      - checkout:
          path: ~/project/androidapp-control
      - run:
          name: "Checkout pinned MIYAKO source from private repository"
          command: |
            set -euo pipefail
            test "${CIRCLE_BRANCH:-}" = "feature/AN-66-miyako-circleci-trial"
            test -n "${CIRCLE_SHA1:-}"
            test "$(git -C "$HOME/project/androidapp-control" rev-parse HEAD)" = "$CIRCLE_SHA1"
            mkdir -p "$HOME/project/miyako-source"
            cd "$HOME/project/miyako-source"
            # The existing androidapp checkout key grants access to
            # flower-standalone only, not the private Vstplugin repository.
            # A missing read-only token is an environment blocker, not a
            # compile failure. Never fall back to an unverified SSH key.
            if [ -z "${MIYAKO_GITHUB_TOKEN:-}" ]; then
              echo 'AN-66 BLOCKED: androidapp CircleCI needs the read-only MIYAKO_GITHUB_TOKEN project secret for private Vstplugin.'
              echo 'No source checkout or Android build was attempted.'
              exit 31
            fi
            AUTH_HELPER="$(mktemp)"
            trap 'rm -f "$AUTH_HELPER"' EXIT
            printf '%s\n' '#!/bin/sh' 'case "$1" in' '  *Username*) printf "%s" "x-access-token" ;;' '  *Password*) printf "%s" "$MIYAKO_GITHUB_TOKEN" ;;' 'esac' > "$AUTH_HELPER"
            chmod 700 "$AUTH_HELPER"
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$AUTH_HELPER" git clone --quiet --depth 1 --branch "feature/AN-66-snes-tile-sprite-25fps" https://github.com/hakaihum-cpu/Vstplugin.git .
            test "$(git rev-parse HEAD)" = "2b6f5906b51a9363b1248be03c401411649e11d5"
            test -f MIYAKO_Android.jucer
            test -f Source/MiyakoTileSpriteScene.h
            # AN-42: the JUCE headless module must exist in both tables.
            grep -Fq '<MODULE id="juce_audio_processors_headless"' MIYAKO_Android.jucer
            grep -Fq '<MODULEPATH id="juce_audio_processors_headless"' MIYAKO_Android.jucer
            printf 'AN-66 source verified at %s\n' "2b6f5906b51a9363b1248be03c401411649e11d5"
            mkdir -p android-artifact
            git rev-parse HEAD > android-artifact/MIYAKO_SOURCE_SHA.txt
      - run:
          name: "Guard the one-off AN-66 build"
          command: |
            set -euo pipefail
            test "${CIRCLE_BRANCH:-}" = "feature/AN-66-miyako-circleci-trial"
            test -n "${CIRCLE_SHA1:-}"
            test "$(git rev-parse HEAD)" = "2b6f5906b51a9363b1248be03c401411649e11d5"
            git show -s --format=%H HEAD | grep -Fx "2b6f5906b51a9363b1248be03c401411649e11d5"
            git diff --quiet
            git diff --cached --quiet
            printf 'Build target AN-66 private source: %s (trigger: %s)\n' "$(git rev-parse HEAD)" "$CIRCLE_SHA1"
      - run:
          name: "Reconstruct and validate canonical MIYAKO Resources pack"
          command: |
            set -euo pipefail
            mkdir -p AndroidAssets
            test -f Android/resources.b64/part_001.txt
            test -f Android/resources.b64/part_050.txt
            PART_COUNT="$(find Android/resources.b64 -maxdepth 1 -type f -name 'part_*.txt' | wc -l)"
            if [ "$PART_COUNT" -ne 50 ]; then
              echo "::error::Expected 50 canonical resource chunks, found $PART_COUNT"
              exit 1
            fi
            cat Android/resources.b64/part_*.txt | tr -d '\r\n' | base64 -d > AndroidAssets/Resources.zip
            
            RESOURCE="AndroidAssets/Resources.zip"
            EXPECTED_SIZE="22308106"
            EXPECTED_SHA256="dec1d916d6c1b8ebf1cdce7f18a6eebcc32bdc991139e652440305bd8895fd86"
            
            if [ ! -f "$RESOURCE" ]; then
              echo "::error::Canonical $RESOURCE is missing. Refusing to build an incomplete ~14MB APK."
              exit 1
            fi
            
            ACTUAL_SIZE="$(stat -c%s "$RESOURCE")"
            if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
              echo "::error::Unexpected Resources.zip size: $ACTUAL_SIZE (expected $EXPECTED_SIZE)"
              exit 1
            fi
            
            echo "$EXPECTED_SHA256  $RESOURCE" | sha256sum -c -
            
            python3 - \<<'PY'
            import zipfile
            path = "AndroidAssets/Resources.zip"
            with zipfile.ZipFile(path) as z:
                names = z.namelist()
                required_prefixes = (
                    "Resources/frames/",
                    "Resources/scenes/",
                    "Resources/crush/",
                )
                missing = [p for p in required_prefixes if not any(n.startswith(p) for n in names)]
                if missing:
                    raise SystemExit("Missing required resource banks: " + ", ".join(missing))
                bad = z.testzip()
                if bad:
                    raise SystemExit("Corrupt Resources.zip entry: " + bad)
                print("Canonical Resources.zip validated:", len(names), "entries")
            PY
      - run:
          name: "Prepare MIYAKO Android launcher icon"
          command: |
            set -euo pipefail
            python3 scripts/prepare_android_icon.py
            test -s Resources/miyako_app_icon.jpg
      - run:
          name: "Materialize validated EFFECTS video frame pack"
          command: |
            set -euo pipefail
            python3 scripts/materialize_effects_video_pack.py
            test -s Resources/effects_video_frames.pack
      - run:
          name: "Materialize validated original KNOWING source frames"
          command: |
            set -euo pipefail
            python3 - \<<'PY'
            from pathlib import Path
            from hashlib import sha256
            import base64, zipfile
            inputs = sorted(Path("Android/knowing_frames.b64").glob("part_*.txt"))
            if len(inputs) != 14:
                raise SystemExit(f"Expected 14 original frame chunks; got {len(inputs)}")
            encoded = ''.join(''.join(p.read_text(encoding='ascii').split()) for p in inputs)
            data = base64.b64decode(encoded, validate=True)
            expected_sha = "bf323970b61af24b2dd5c08674a5040902a2cf3d52df39abb35be1a9a7bcdbb5"
            if len(data) != 1257671 or sha256(data).hexdigest() != expected_sha:
                raise SystemExit("KNOWING source ZIP size/SHA-256 mismatch")
            dest = Path("Resources/knowing_frames_original.zip")
            dest.parent.mkdir(parents=True, exist_ok=True)
            dest.write_bytes(data)
            with zipfile.ZipFile(dest) as z:
                expected = [f"{i:03d}.jpg" for i in range(1, 141)]
                if z.namelist() != expected:
                    raise SystemExit("KNOWING source ZIP must contain 001.jpg..140.jpg in order")
                bad = z.testzip()
                if bad is not None:
                    raise SystemExit(f"KNOWING corrupted frame: {bad}")
            print("KNOWING 140 original frames verified; DOT conversion is performed by #204 renderer at runtime")
            PY
      - run:
          name: "Install Linux build dependencies"
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y \
              libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
              libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev \
              libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
              libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
      - run:
          name: "Checkout JUCE 9.0.2"
          command: |
            set -euo pipefail
            git clone --depth 1 --branch 9.0.2 https://github.com/juce-framework/JUCE.git JUCE
      - run:
          name: "Patch JUCE Android gamepad keys for RG Rotate"
          command: |
            set -euo pipefail
            python3 scripts/patch_juce_android_gamepad.py
            grep -q 'KEYCODE_BUTTON_A' JUCE/modules/juce_gui_basics/native/juce_Windowing_android.cpp
            grep -q 'KEYCODE_BUTTON_SELECT' JUCE/modules/juce_gui_basics/native/juce_Windowing_android.cpp
      - run:
          name: "Build Projucer"
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            cmake -S JUCE -B JUCE/build -DJUCE_BUILD_EXTRAS=ON -DJUCE_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
            cmake --build JUCE/build --target Projucer -j2
            PROJUCER="$(find JUCE/build -type f -name Projucer -perm -111 | head -n 1)"
            test -n "$PROJUCER"
            printf 'export PROJUCER="%s"\n' "$PROJUCER" >> "$BASH_ENV"
      - run:
          name: "Install Android SDK components"
          command: |
            set -euo pipefail
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "ndk;26.1.10909125"
      - run:
          name: "Stamp APK build identity"
          command: |
            set -euo pipefail
            # Generated in the CI working tree only. The committed source keeps
            # a LOCAL BUILD fallback so off-CI compilation still works.
            printf '#pragma once\n#define MIYAKO_BUILD_LABEL "RUN #%s"\n' "$CIRCLE_BUILD_NUM" > Source/MiyakoBuildInfo.h
            grep -q "RUN #$CIRCLE_BUILD_NUM" Source/MiyakoBuildInfo.h
      - run:
          name: "Generate Android Studio project"
          command: |
            set -euo pipefail
            "$PROJUCER" --resave MIYAKO_Android.jucer
            test -d Builds/Android
            # AN-15: reuse androidapp's validated CMake/Ninja job-pool patcher.
            python3 "$HOME/project/androidapp-control/scripts/patch_android_native_parallelism.py" Builds/Android/app/build.gradle
            grep -F -- '-DCMAKE_JOB_POOLS:STRING=compile=2;link=1' Builds/Android/app/build.gradle
            grep -F -- '-DCMAKE_JOB_POOL_COMPILE:STRING=compile' Builds/Android/app/build.gradle
            grep -F -- '-DCMAKE_JOB_POOL_LINK:STRING=link' Builds/Android/app/build.gradle
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > Builds/Android/local.properties
      - run:
          name: "Integrate verified Speed Editor USB bridge"
          command: |
            set -euo pipefail
            JAVA_DIR="Builds/Android/app/src/main/java/local/miyako/android"
            MANIFEST="Builds/Android/app/src/main/AndroidManifest.xml"
            test -f Android/SpeedEditorUsbController.java
            test -f "$MANIFEST"
            mkdir -p "$JAVA_DIR"
            cp Android/SpeedEditorUsbController.java "$JAVA_DIR/SpeedEditorUsbController.java"
            python3 - "$MANIFEST" \<<'PY'
            from pathlib import Path
            import sys
            path = Path(sys.argv[1])
            text = path.read_text(encoding="utf-8")
            feature = '<uses-feature android:name="android.hardware.usb.host" android:required="false" />'
            if feature not in text:
                marker = "<application"
                pos = text.find(marker)
                if pos < 0:
                    raise SystemExit("AndroidManifest.xml has no <application> tag")
                text = text[:pos] + "    " + feature + "\n    " + text[pos:]
                path.write_text(text, encoding="utf-8")
            PY
            grep -q 'android.hardware.usb.host' "$MANIFEST"
            test -s "$JAVA_DIR/SpeedEditorUsbController.java"
      - run:
          name: "Create Android signing keystore"
          command: |
            set -euo pipefail
            mkdir -p "$HOME/.android"
            rm -f "$HOME/.android/debug.keystore"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - run:
          name: "Build optimized installable APK"
          no_output_timeout: 30m
          command: |
            # AN-10/11/13/15: preserve full diagnostics and bound native jobs.
            set -u
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
            export CMAKE_BUILD_PARALLEL_LEVEL=2
            export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -XX:ActiveProcessorCount=2"
            mkdir -p android-artifact
            LOG="$PWD/android-artifact/gradle-build.log"
            printf '[preflight] MIYAKO AN-66 source %s\n' "$(git rev-parse HEAD)" > "$LOG"
            cd Builds/Android
            chmod +x gradlew
            set +e
            ./gradlew assembleRelease --stacktrace --info --console=plain --no-daemon --max-workers=2 >> "$LOG" 2>&1 &
            GRADLE_PID=$!
            while kill -0 "$GRADLE_PID" 2>/dev/null; do
              echo "[heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              free -m || true
              ps -eo pid,ppid,%cpu,%mem,rss,comm --sort=-rss | head -n 12 || true
              sleep 30
            done
            wait "$GRADLE_PID"
            STATUS=$?
            cd ../..
            printf '%s\n' "$STATUS" > android-artifact/gradle-exit-code.txt
            tail -n 120 "$LOG" || true
            exit "$STATUS"
      - run:
          name: "Collect APK"
          command: |
            set -euo pipefail
            mkdir -p android-artifact
            APK="$(find Builds/Android -type f -name '*.apk' | grep -E '/release/|release\.apk$' | head -n 1)"
            test -n "$APK"
            cp "$APK" android-artifact/MIYAKO-Android.apk
            cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-artifact/apksigner.jar
            cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" android-artifact/zipalign
            chmod +x android-artifact/zipalign
            
            python3 - "$APK" \<<'PY'
            import hashlib
            import io
            import sys
            import zipfile
            
            apk_path = sys.argv[1]
            expected_size = 22308106
            expected_sha256 = "dec1d916d6c1b8ebf1cdce7f18a6eebcc32bdc991139e652440305bd8895fd86"
            
            with zipfile.ZipFile(apk_path) as apk:
                try:
                    payload = apk.read("assets/Resources.zip")
                except KeyError:
                    raise SystemExit("assets/Resources.zip is missing from APK; refusing incomplete artifact")
            
            if len(payload) != expected_size:
                raise SystemExit(f"APK Resources.zip size mismatch: {len(payload)} != {expected_size}")
            
            actual_sha256 = hashlib.sha256(payload).hexdigest()
            if actual_sha256 != expected_sha256:
                raise SystemExit(f"APK Resources.zip SHA-256 mismatch: {actual_sha256}")
            
            with zipfile.ZipFile(io.BytesIO(payload)) as resources:
                names = resources.namelist()
                for prefix in ("Resources/frames/", "Resources/scenes/", "Resources/crush/"):
                    if not any(name.startswith(prefix) for name in names):
                        raise SystemExit(f"APK resource bank missing: {prefix}")
            
            print("APK canonical Resources.zip verified:", expected_size, actual_sha256)
            PY
            
            APK_SIZE="$(stat -c%s "$APK")"
            if [ "$APK_SIZE" -lt 35000000 ]; then
              echo "::error::APK is unexpectedly small ($APK_SIZE bytes). Refusing incomplete artifact."
              exit 1
            fi
            
            sha256sum android-artifact/MIYAKO-Android.apk | tee android-artifact/SHA256.txt
            printf 'AN-66 Source SHA: %s\nCircleCI trigger SHA: %s\nCircleCI Build: %s\n' "$(git rev-parse HEAD)" "$CIRCLE_SHA1" "$CIRCLE_BUILD_NUM" > android-artifact/BUILD_INFO.txt
            test "$(stat -c%s android-artifact/MIYAKO-Android.apk)" -ge 35000000

      - run:
          name: "Always collect AN-66 failure diagnostics"
          when: always
          command: |
            set -u
            mkdir -p "$HOME/project/miyako-source/android-artifact"
            (
              echo "AN-66 troubleshooting record"
              echo "CircleCI branch: ${CIRCLE_BRANCH:-unset}"
              echo "CircleCI pipeline: ${CIRCLE_PIPELINE_ID:-unset}"
              echo "CircleCI build number: ${CIRCLE_BUILD_NUM:-unset}"
              echo "Control checkout: $(git -C "$HOME/project/androidapp-control" rev-parse HEAD 2>/dev/null || true)"
              echo "MIYAKO checkout: $(git -C "$HOME/project/miyako-source" rev-parse HEAD 2>/dev/null || true)"
              echo "MIYAKO private repository token present: $([ -n "${MIYAKO_GITHUB_TOKEN:-}" ] && echo yes || echo no)"
              free -m || true
              df -h || true
            ) > "$HOME/project/miyako-source/android-artifact/DIAGNOSTICS.txt" 2>&1

      - store_artifacts:
          path: android-artifact
          destination: MIYAKO-AN66-CircleCI

workflows:
  an66_manual_trial:
    when: << pipeline.parameters.run_build >>
    jobs:
      - manual_android_build:
          filters:
            branches:
              only:
                - feature/AN-66-miyako-circleci-trial
