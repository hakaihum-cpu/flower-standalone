# FM-1 MIYAKO native standalone branch. CI deliberately has NO upstream KARMA checkout.
# Manual only (run_build=true). This workflow tests native source, NOT flashable FWSC.
version: 2.1

parameters:
  run_build:
    type: boolean
    default: false

jobs:
  fm1_standalone_preflight:
    docker:
      - image: cimg/base:2024.08-22.04
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify exact standalone branch and source boundary
          command: |
            set -eu
            test "$CIRCLE_BRANCH" = "feature/fm1-miyako-standalone-20261106"
            python3 -m py_compile fm1/native/verify_standalone.py fm1/native/test_pipeline_contract.py
            python3 fm1/native/verify_standalone.py
            python3 fm1/native/test_pipeline_contract.py
      - run:
          name: Host compile and exercise actual MIYAKO native control source
          command: |
            set -eu
            cc -std=c99 -O1 -g -Wall -Wextra -Werror -fno-pie -no-pie                -fsanitize=address,undefined -fno-sanitize-recover=all                fm1/native/mi_control.c fm1/native/test_mi_control.c                -o /tmp/miyako_fm1_control_test
            /tmp/miyako_fm1_control_test
      - run:
          name: Record actual readiness stage; do not package a fake firmware
          command: |
            set -eu
            mkdir -p fm1-dist
            printf '%s\n'               'MIYAKO FM-1 standalone native preflight only'               'PASS here is NOT firmware compile, FWSC, or physical device verification.'               'Missing: real MIYAKO audio/FX implementation, all required visual media,'               'independent FM-1 HAL and startup/boot/update, target linker, hardware tests.'               > fm1-dist/READINESS.txt
            test ! -e fm1-dist/MIYAKO-FM1-PREVIEW.fwsc
      - store_artifacts:
          path: fm1-dist
          destination: fm1

workflows:
  fm1_manual:
    when: << pipeline.parameters.run_build >>
    jobs:
      - fm1_standalone_preflight:
          filters:
            branches:
              only: feature/fm1-miyako-standalone-20261106
