# Independent MIYAKO app on the MPL-2.0 fm1-base hardware layer.
name = "MIYAKO"
# Development FWSC revision FM-1_938 (baseline identity FM-1_934).
# fm1-base normally appends "00"; pinned build.py patch changes suffix to "38".
id_prefix = "FM-1_9"
usb_manufacturer = "MIYAKO"
usb_product = "MIYAKO FM-1"
o2 = ["mi_control.c", "mi_audio.c", "mi_fx_dsp.c", "mi_video.c", "mi_recorder.c"]
ble = false
ble_central = false
usb_audio_in = false
usb_audio_out = false
repo = "https://github.com/hakaihum-cpu/flower-standalone"
licence = "GPL-3.0-only"
credits = "MIYAKO native application with fm1-base / felucca-bsp hardware support (MPL-2.0)"
author = "MIYAKO"
description = "Native MIYAKO FM-1 development firmware. NOT a complete MIYAKO port."
tags = ["synth", "utility"]
# fm1-base standard resource: 96x96 original-source RGB565 16-colour VQ.
backup = true
resources = "miyako_media.bin"
resources_what = "MIYAKO image data"
resources_what_ja = "MIYAKO映像素材"
