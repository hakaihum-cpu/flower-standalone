# Independent MIYAKO app on the MPL-2.0 fm1-base hardware layer.
name = "MIYAKO"
# Monotonic 3-digit FWSC identity is set from CIRCLE_PIPELINE_NUMBER.
# fm1-base's default "00" suffix is patched BEFORE every host/target build.
id_prefix = "FM-1_9"
usb_manufacturer = "MIYAKO"
usb_product = "MIYAKO FM-1"
o2 = ["mi_control.c", "mi_audio.c", "mi_fx_dsp.c", "mi_video.c", "mi_recorder.c", "mi_rec_pcm7.c", "mi_slicer.c", "mi_piano_set1_engine.c", "mi_piano_set1_51.c", "mi_piano_set1_58.c", "mi_piano_set1_65.c", "mi_mhp2_codec_poc.c", "mi_mhp2_patch_poc.c"]
ble = false
ble_central = false
usb_audio_in = false
usb_audio_out = false
repo = "https://github.com/hakaihum-cpu/flower-standalone"
licence = "GPL-3.0-only"
credits = "MIYAKO native application with fm1-base / felucca-bsp hardware support (MPL-2.0)"
author = "MIYAKO"
description = "Native MIYAKO FM-1 development firmware. NOT a complete MIYAKO port."
tags = ["synth", "utility"]
# fm1-base standard res.bin installer, carrying verified offline MHP2+patch payload.
backup = true
resources = "miyako_media.bin"
resources_what = "MIYAKO image data"
resources_what_ja = "MIYAKO映像素材"
