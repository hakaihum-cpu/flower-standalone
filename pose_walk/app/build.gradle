plugins { id 'com.android.application' }

android {
    namespace 'com.posewalk.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.posewalk.studio'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
