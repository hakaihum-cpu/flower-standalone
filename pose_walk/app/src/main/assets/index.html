<html lang="ja">
<head>
  <meta charset="utf-8">

  <title>POSE WALK — pixel sandbox</title>
  <style>:root{--paper:#eae9e4;--white:#f9f8f4;--ink:#222327;--muted:#8c8d8b;--stroke:#cecec8;--accent:#4f5c55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:ui-monospace,'SFMono-Regular',Consolas,'Noto Sans Mono',monospace}body{overscroll-behavior-y:none}button{font:inherit;cursor:pointer;touch-action:none;user-select:none}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{width:min(100%,550px);margin:0 auto;padding:18px 18px 24px;user-select:none}.topbar{display:flex;justify-content:space-between;align-items:end;margin:1px 0 15px}.eyebrow{font-size:9px;font-weight:700;letter-spacing:.19em;color:var(--muted);margin:0 0 5px}.topbar h1{margin:0;line-height:1;font-size:clamp(28px,9.5vw,42px);font-weight:900;letter-spacing:-.083em}.topbar h1 span{font-weight:300;letter-spacing:-.075em}.blinker{display:inline-block;background:var(--ink);width:7px;height:7px;vertical-align:top;margin:4px 0 0 8px;animation:blink 1.4s steps(1) infinite}@keyframes blink{50%{opacity:0}}.score{display:grid;text-align:right;align-items:end;padding-bottom:2px}.score strong{font-size:36px;line-height:.75;letter-spacing:-.1em}.score span{font-size:9px;letter-spacing:.12em;margin-top:10px}.frame{position:relative;background:var(--white);border:1px solid var(--stroke);box-shadow:4px 4px 0 #d5d4ce;padding:10px;aspect-ratio:1/1;overflow:hidden}.frame canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}.frame-ornament{position:absolute;top:18px;left:19px;right:20px;z-index:2;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.09em;color:#aaa9a4;pointer-events:none}.frame-ornament span{color:#a4a49f}.frame-foot{position:absolute;bottom:17px;left:18px;right:18px;z-index:2;display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.11em;color:#777974;pointer-events:none}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.directions,.pose-controls{display:flex;gap:7px}.controls button{height:64px;border:1px solid var(--ink);background:var(--ink);color:#f7f7f3;box-shadow:3px 3px 0 #abaea6;border-radius:0;min-width:64px;font-size:20px;transition:transform .07s,box-shadow .07s}.controls .arrow{width:74px;font-size:22px}.pose-controls button{min-width:52px;background:#fafaf7;color:var(--ink);font-size:28px}.pose-controls #random{font-size:25px}.controls button:active,.controls button.pressed{transform:translate(2px,2px);box-shadow:1px 1px 0 #abaea6;background:#58645b;color:#fff}.help-row{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 0 16px;font-size:10px;color:#626560;border-bottom:1px solid var(--stroke)}.text-button{font-size:10px;padding:3px 0;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:none;color:var(--ink)}.library{margin-top:18px}.library-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.library h2{font-size:16px;letter-spacing:.01em;margin:0;font-weight:750}.page-counter{font-size:12px;font-weight:700;letter-spacing:.1em;padding-bottom:1px}.tabs{display:flex;overflow-x:auto;gap:5px;padding-bottom:12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{padding:9px 10px;border:1px solid var(--stroke);background:transparent;color:#62635f;white-space:nowrap;font-size:11px;line-height:1}.tab span{color:#979791;font-size:8px;margin-left:3px}.tab.selected{background:var(--ink);color:#fff;border-color:var(--ink)}.tab.selected span{color:#c7c8c4}.pose-strip{display:grid;grid-auto-columns:74px;grid-auto-flow:column;gap:7px;overflow-x:auto;scroll-snap-type:x proximity;padding:1px 2px 8px 1px;scrollbar-color:#aaa9a2 transparent;scrollbar-width:thin}.pose-tile{scroll-snap-align:start;border:1px solid #ccccc7;background:#f5f4f0;min-height:92px;position:relative;display:flex;align-items:center;justify-content:center;padding:8px 6px 18px;color:#858680}.pose-tile.active{border:2px solid #292b2a;background:#fff;padding:7px 5px 17px}.pose-tile .number{position:absolute;bottom:5px;left:6px;font-size:9px;line-height:1;font-weight:700}.pose-tile img{max-width:100%;max-height:63px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}.pose-tile.active .number{color:#242722}footer{margin-top:16px;display:flex;justify-content:space-between;font-size:8px;letter-spacing:.09em;color:#9a9a93}footer span{white-space:nowrap}
@media(max-width:380px){.app{padding:12px 12px 18px}.frame{padding:8px}.controls button{height:59px;min-width:49px}.controls .arrow{width:62px}.pose-controls button{min-width:47px}.help-row{font-size:9px;gap:5px}.tab{padding:8px}.pose-strip{grid-auto-columns:68px}}
@media(min-width:650px){.app{padding-top:24px}}

</style>

  <script>(() => {
'use strict';
const poses = window.POSES || [];
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', {alpha:false});
ctx.imageSmoothingEnabled = false;
const tileWrap = document.getElementById('pose-strip');
const status = document.getElementById('frame-status');
const counter = document.getElementById('pose-number');
const W = 384, H = 384, ground = 328;
const imgs = poses.map((p)=> { const im=new Image(); im.decoding='async'; im.src=p.src; return im; });
const walkFrames = (window.WALK_CYCLE || []).map(p => { const im=new Image(); im.decoding='async'; im.src=p.src; return im; });
const state = {pose:0,filter:'all',x:192,dir:1,move:0,walkClock:0,last:0,walkLeft:false,walkRight:false,bob:0};
const groups = {stand:'STAND',sit:'SIT',floor:'FLOOR',walk:'WALK'};
const tiles = [];
function makeTiles() {
  poses.forEach((p,i)=> {
    const el = document.createElement('button');
    el.className = 'pose-tile';
    el.type = 'button';
    el.setAttribute('aria-label', `${i+1}番 ${groups[p.group]} ポーズ`);
    const im=document.createElement('img'); im.src=p.src; im.alt=''; im.loading='lazy';
    const t=document.createElement('span');t.className='number';t.textContent=String(i+1).padStart(2,'0');
    el.append(im,t);
    el.addEventListener('click',()=>setPose(i));
    tileWrap.append(el);tiles.push(el);
  });
}
function updateUI(scroll=false) {
  const p=poses[state.pose]; if (!p)return;
  status.textContent=`${groups[p.group]} / ${String(state.pose+1).padStart(2,'0')}`;
  counter.textContent=`${String(state.pose+1).padStart(2,'0')} / ${String(poses.length).padStart(2,'0')}`;
  tiles.forEach((t,i)=>{t.classList.toggle('active',i===state.pose);t.hidden=state.filter!=='all'&&poses[i].group!==state.filter;});
  if(scroll && !tiles[state.pose].hidden)tiles[state.pose].scrollIntoView({behavior:'smooth',inline:'nearest',block:'nearest'});
}
function setPose(i) {state.pose=(i+poses.length)%poses.length;state.move=0;state.walkLeft=false;state.walkRight=false;updateUI(true);}
const eligible=()=>poses.map((p,i)=>({p,i})).filter(o=>state.filter==='all'||o.p.group===state.filter).map(o=>o.i);
function stepPose(step) {const ids=eligible();let idx=ids.indexOf(state.pose); if(idx<0)idx=0;setPose(ids[(idx+step+ids.length)%ids.length]);}
const prev=document.getElementById('previous');
const next=document.getElementById('next');
const random=document.getElementById('random');
prev.addEventListener('click',()=>stepPose(-1));
next.addEventListener('click',()=>stepPose(1));
random.addEventListener('click',()=>{const ids=eligible();if(ids.length===1)return;let choice=state.pose;while(choice===state.pose)choice=ids[Math.floor(Math.random()*ids.length)];setPose(choice)});
document.getElementById('reset').addEventListener('click',()=>{state.x=192;state.dir=1;setPose(0)});
Array.from(document.querySelectorAll('.tab')).forEach(tab=>tab.addEventListener('click',()=>{
 state.filter=tab.dataset.filter;
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('selected',t===tab));
 if(state.filter!=='all'&&poses[state.pose].group!==state.filter){const i=eligible()[0]; if(i!==undefined)state.pose=i;}
 updateUI();tileWrap.scrollLeft=0;
}));
function refreshMove(){state.move=(state.walkRight?1:0)-(state.walkLeft?1:0)}
function setHeld(dir,on){if(dir<0)state.walkLeft=on;else state.walkRight=on;refreshMove()}
function bindDirectional(id,dir){
 const button=document.getElementById(id);const pointers=new Set();
 button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);pointers.add(e.pointerId);setHeld(dir,true);button.classList.add('pressed')});
 const release=e=>{if(pointers.has(e.pointerId))pointers.delete(e.pointerId);if(!pointers.size){setHeld(dir,false);button.classList.remove('pressed')}};
 button.addEventListener('pointerup',release);button.addEventListener('pointercancel',release);button.addEventListener('lostpointercapture',()=>{pointers.clear();setHeld(dir,false);button.classList.remove('pressed')});
}
bindDirectional('move-left',-1);bindDirectional('move-right',1);
const keyboard=new Set();
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','A','D'].includes(e.key))e.preventDefault();
 if(e.repeat)return;
 keyboard.add(e.key);if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')setHeld(-1,true);
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')setHeld(1,true);
 if(e.key==='ArrowUp')stepPose(-1);if(e.key==='ArrowDown'||e.key===' ')stepPose(1);
});
window.addEventListener('keyup',e=>{
 keyboard.delete(e.key);
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')setHeld(-1,false);
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')setHeld(1,false);
});
window.addEventListener('blur',()=>{state.walkLeft=false;state.walkRight=false;state.move=0;});
function pixelRect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.floor(x),Math.floor(y),Math.ceil(w),Math.ceil(h))}
function drawEnvironment(time){
 ctx.fillStyle='#f9f8f4';ctx.fillRect(0,0,W,H);
 // photo studio floor, low-contrast stippling of pixel art
 pixelRect(0,327,W,1,'#cbc9c3');pixelRect(0,329,W,H-329,'#f1f0eb');
 ctx.fillStyle='#e6e5de';
 for(let x=3;x<W;x+=19){ const y=341+((x*37)%25);ctx.fillRect(x,y,2,1);}
 for(let x=16;x<W;x+=35){ctx.fillRect(x,369,7,1)}
 pixelRect(19,20,17,1,'#cccac2');pixelRect(19,23,5,1,'#cccac2');
 ctx.fillStyle='#d9d8d2';ctx.font='9px monospace';ctx.fillText('FREE MOVEMENT / NO OBJECTIVES',23,40);
 // stage floor markers
 for(let x=30;x<365;x+=36)pixelRect(x,327,11,1,'#dddcd4');
}
function drawPerson(t){
 const moving=state.move!==0;
 let poseIndex=state.pose;
  const frameIndex=Math.floor(state.walkClock*12)%walkFrames.length;
  const p=poses[poseIndex], im=moving?walkFrames[frameIndex]:imgs[poseIndex];
  if(!im||!im.complete||!im.naturalWidth)return;
  // Twelve handcrafted gait frames use one right-facing source upper body and articulated legs. Every shoe toe faces RIGHT.
  const scale=moving?1.94:((p.group==='walk')?4.24:2.47);
 const w=im.naturalWidth*scale,h=im.naturalHeight*scale;
 const bob=moving?Math.sin(state.walkClock*11)*2:Math.sin(t/2300)*.55;
 const x=Math.round(state.x-w/2),y=Math.round(ground-h+bob);
 ctx.fillStyle='#deddd6';
 ctx.beginPath();ctx.ellipse(Math.round(state.x),330,Math.max(18,w*.4),3.7,0,0,Math.PI*2);ctx.fill();
 // Walk cycle always faces RIGHT in its source pixels. Mirror every frame only for LEFT.
 let flip=moving?(state.dir<0):(state.dir>0&&poseIndex===2);
 if(flip){ctx.save();ctx.translate(Math.round(state.x)*2,0);ctx.scale(-1,1)}
 ctx.drawImage(im,x,y,Math.round(w),Math.round(h));
 if(flip)ctx.restore();
}
function loop(now){
 if(!state.last)state.last=now;
 const dt=Math.min(.05,Math.max(0,(now-state.last)/1000));state.last=now;
 if(state.move){state.dir=state.move>0?1:-1;state.x=Math.max(39,Math.min(W-39,state.x+state.move*116*dt));state.walkClock+=dt;}
 drawEnvironment(now);drawPerson(now);requestAnimationFrame(loop);
}
makeTiles();updateUI();requestAnimationFrame(loop);
// Minimal state for local browser/Android checks.
window.poseWalkDebug=()=>({pose:state.pose,x:Math.round(state.x),moving:state.move,dir:state.dir,walkFrame:Math.floor(state.walkClock*12)%walkFrames.length,walkFrames:walkFrames.length,loaded:imgs.filter(i=>i.complete&&i.naturalWidth).length,total:imgs.length});
})();
</script>
