name: Build Live Instrument Sampler Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/AN-72-live-instrument-sampler
    paths:
      - ".github/live-instrument-sampler-build-trigger.txt"

concurrency:
  group: live-instrument-sampler-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static preflight
        shell: pwsh
        run: ./LiveInstrumentSampler/scripts/preflight.ps1

      - name: Configure Core-only preflight
        shell: pwsh
        run: cmake -S LiveInstrumentSampler -B build-core -DLIVE_SAMPLER_CORE_ONLY=ON

      - name: Build Core-only preflight
        shell: pwsh
        run: cmake --build build-core --config Release --target LiveInstrumentSamplerCoreTests

      - name: Run Core-only preflight
        shell: pwsh
        run: ctest --test-dir build-core -C Release --output-on-failure

      - name: Checkout JUCE 9.0.3
        shell: pwsh
        run: git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure full Windows app
        shell: pwsh
        run: cmake -S LiveInstrumentSampler -B build-live -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build Release EXE
        shell: pwsh
        run: cmake --build build-live --config Release --target EP_Live_Instrument_Sampler --parallel 2

      - name: Inspect Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Path build-live -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -eq "EP Live Instrument Sampler.exe" } |
            Select-Object -First 1

          if ($null -eq $exe) { throw "EP Live Instrument Sampler.exe was not produced." }
          if ($exe.Length -lt 100000) { throw "Executable is unexpectedly small: $($exe.Length) bytes" }

          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          if ($bytes.Length -lt 256) { throw "Executable is too small for PE validation." }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Output does not have DOS MZ header."
          }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or ($peOffset + 4) -gt $bytes.Length) {
            throw "Invalid PE header offset."
          }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0x00 -or $bytes[$peOffset + 3] -ne 0x00) {
            throw "Output does not have PE signature."
          }

          Write-Host "EXE: $($exe.FullName)"
          Write-Host "SIZE: $($exe.Length)"
          Copy-Item $exe.FullName "${{ github.workspace }}/EP-Live-Instrument-Sampler-Windows.exe"

          Get-FileHash "${{ github.workspace }}/EP-Live-Instrument-Sampler-Windows.exe" -Algorithm SHA256 |
            Format-List | Out-String | Set-Content "${{ github.workspace }}/SHA256.txt"
          "${{ github.sha }}" | Set-Content "${{ github.workspace }}/SOURCE_COMMIT.txt"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: EP-Live-Instrument-Sampler-Windows
          path: |
            EP-Live-Instrument-Sampler-Windows.exe
            SHA256.txt
            SOURCE_COMMIT.txt
            LiveInstrumentSampler/ASIO_TEST.md
          if-no-files-found: error
          compression-level: 6
