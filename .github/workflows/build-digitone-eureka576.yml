name: Digitone MOOD MkII FACE FOCUS random 343
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/feature/digitone-mood-facefocus-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install m68k toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu
          python3 -m pip install --user --break-system-packages 'Pillow==11.3.0'
          m68k-linux-gnu-gcc --version
      - name: Obtain and verify official OS 1.44
        run: |
          set -euo pipefail
          mkdir -p _firmware
          curl -fL --retry 3 -o _firmware/stock.zip 'https://www.elektron.se/wp-content/uploads/2026/10/Digitone_and_Digitone_Keys_OS1.44_dist.zip'
          unzip -p _firmware/stock.zip Digitone_and_Digitone_Keys_OS1.44.syx > _firmware/stock.syx
          echo 'd4f200d04484333d82822db7744e6484d0def8f2db8ddf55ee2b780cc13c9659  _firmware/stock.syx' | sha256sum -c -
      - name: Reconstruct original MOOD footage and convert 343 yellow-outline frames
        run: |
          set -euo pipefail
          python3 scripts/materialize_frame_pack.py
          python3 ports/digitone_eureka576/prepare.py Resources/mood_frames.pack ports/digitone_eureka576/frames.bin --seek ports/digitone_eureka576/seek.bin --preview ports/digitone_eureka576/mood_lcd_preview.png
          sha256sum ports/digitone_eureka576/frames.bin
          test "$(stat -c '%s' ports/digitone_eureka576/frames.bin)" -gt 0
          test "$(stat -c '%s' ports/digitone_eureka576/frames.bin)" -lt 351232
          test "$(stat -c '%s' ports/digitone_eureka576/seek.bin)" -eq 59624
          test -s ports/digitone_eureka576/mood_lcd_preview.png
          python3 ports/digitone_eureka576/tests/verify_stream.py \
            Resources/mood_frames.pack \
            ports/digitone_eureka576/frames.bin \
            ports/digitone_eureka576/reference.bin \
            ports/digitone_eureka576/seek.bin
          (
            cd ports/digitone_eureka576
            gcc -std=c11 -Wall -Wextra -Werror -Wconversion -O1 -g \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -I tests/include tests/test_random.c tests/native_embed.s \
              -o _host_check
            ./_host_check
            rm _host_check reference.bin
          )
      - name: Obtain pinned elekloader and core
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.9.0 https://github.com/elekloader/elekloader.git _elekloader
          test "$(git -C _elekloader rev-parse HEAD)" = 'dc6ac1fd6792eeb3ab217b6ab2d6b73aa7aa30f6'
          curl -fL --retry 3 -o _firmware/core.elemod 'https://github.com/elekloader/elekloader/releases/download/v0.9.0/core-dn1-4.1.1-os1.44.elemod'
          echo '2b474537c4b9772ef79bd6dfc7218866146ec4ac02c55e77b1bb6078803befdf  _firmware/core.elemod' | sha256sum -c -
      - name: Build, lint, patch, verify
        run: |
          set -euo pipefail
          cd _elekloader
          python3 -m elekloader.sdk.build "$GITHUB_WORKSPACE/ports/digitone_eureka576" --stock "$GITHUB_WORKSPACE/_firmware/stock.syx"
          mapfile -t MODS < <(find "$GITHUB_WORKSPACE/ports/digitone_eureka576/out" -maxdepth 1 -name '*.elemod' -type f | sort)
          if [[ "${#MODS[@]}" -ne 1 ]]; then
            printf 'ERROR: expected exactly one .elemod, found %s\n' "${#MODS[@]}" >&2
            exit 1
          fi
          MOD="${MODS[0]}"
          python3 -m elekloader.lint "$MOD" --stock "$GITHUB_WORKSPACE/_firmware/stock.syx" --with "$GITHUB_WORKSPACE/_firmware/core.elemod"
          python3 -m elekloader.patch --stock "$GITHUB_WORKSPACE/_firmware/stock.syx" --mod "$GITHUB_WORKSPACE/_firmware/core.elemod" --mod "$MOD" --check
          mkdir -p "$GITHUB_WORKSPACE/_release"
          python3 -m elekloader.patch --stock "$GITHUB_WORKSPACE/_firmware/stock.syx" --mod "$GITHUB_WORKSPACE/_firmware/core.elemod" --mod "$MOD" --out "$GITHUB_WORKSPACE/_release/Digitone_OS1.44_MOOD_FACE343.syx" --version MF43
          (
            cd "$GITHUB_WORKSPACE/_release"
            sha256sum Digitone_OS1.44_MOOD_FACE343.syx > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          cp "$MOD" "$GITHUB_WORKSPACE/_release/"
          cp "$GITHUB_WORKSPACE/ports/digitone_eureka576/mood_lcd_preview.png" "$GITHUB_WORKSPACE/_release/"
      - name: Upload build files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Digitone-OS1.44-MOOD-FACE343
          path: _release/
          if-no-files-found: error
          retention-days: 30
