name: Digitone PG82 EXCLUSIVE FX + USER EUREKA TILES (PG79 protected)
on:
  workflow_dispatch:
  # User-authorized PG82 single-shot build; immediately disarm after queue.
  push:
    branches:
      - feature/digitone-eureka-user-tiles-20261107
    paths:
      - .github/workflows/build-digitone-eureka576.yml
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/feature/digitone-eureka-user-tiles-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install m68k toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu
          python3 -m pip install --user --break-system-packages 'Pillow==12.3.0' 'numpy==2.3.5' 'opencv-python-headless==4.13.0.92'
          m68k-linux-gnu-gcc --version
      - name: Obtain and verify official OS 1.44
        run: |
          set -euo pipefail
          mkdir -p _firmware
          curl -fL --retry 3 -o _firmware/stock.zip 'https://www.elektron.se/wp-content/uploads/2026/10/Digitone_and_Digitone_Keys_OS1.44_dist.zip'
          unzip -p _firmware/stock.zip Digitone_and_Digitone_Keys_OS1.44.syx > _firmware/stock.syx
          echo 'd4f200d04484333d82822db7744e6484d0def8f2db8ddf55ee2b780cc13c9659  _firmware/stock.syx' | sha256sum -c -
      - name: Reconstruct 576 supplied-source EUREKA tile frames using unchanged HYBRID04 codec
        run: |
          set -euo pipefail
          python3 ports/digitone_eureka576/prepare_user_tiles.py
          sha256sum ports/digitone_eureka576/frames.bin
          test "$(stat -c '%s' ports/digitone_eureka576/frames.bin)" -gt 0
          test "$(stat -c '%s' ports/digitone_eureka576/frames.bin)" -lt 589824
          test "$(stat -c '%s' ports/digitone_eureka576/seek.bin)" -eq 98688
          test -s ports/digitone_eureka576/eureka_lcd_preview.png
          python3 ports/digitone_eureka576/tests/verify_user_tiles.py
          echo 'ef27b3bf8b85a0cdb3b7461df0a5d76b110138ddd7bf1177deb3e8f78d865c47  ports/digitone_eureka576/frames.bin' | sha256sum -c -
          echo 'd5757d7293d2ef04536518ab07927a7768d52f9db7bbdc7abdc52e7acab049e3  ports/digitone_eureka576/seek.bin' | sha256sum -c -
          (
            cd ports/digitone_eureka576
            gcc -std=c11 -Wall -Wextra -Werror -Wconversion -O1 -g \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -I tests/include tests/test_random.c tests/native_embed.s \
              -o _host_check
            ./_host_check
            rm _host_check
          )
      - name: Verify module callback declarations before cross-compilation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          for module in ('digitone_eureka576', 'digitone_fx_rack'):
              root = Path('ports') / module
              doc = json.loads((root / 'mod.json').read_text())
              source = '\n'.join((root / f).read_text() for f in doc['sources'] if f.endswith('.c'))
              for subscription in doc.get('subscribe', []):
                  fn = subscription['fn']
                  pattern = r'\b(?:void|int|int32_t)\s+' + re.escape(fn) + r'\s*\('
                  if not re.search(pattern, source):
                      raise SystemExit(f'ERROR: {module} subscribes undefined callback {fn}')
              print('PASS: all declared callbacks defined:', module)
          PY
      - name: Preflight GRANULAR native DSP with UBSan
        run: |
          set -euo pipefail
          cd ports/digitone_dreamy_trial
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Wconversion \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I tests/include tests/test_dreamy.c -o _dreamy_host_test
          ./_dreamy_host_test
          rm _dreamy_host_test
          python3 - <<'PY'
          from pathlib import Path
          a=Path('../digitone_eureka576/eureka576.c').read_text()
          e=a
          d=Path('dreamy.c').read_text()
          assert 'core_audio_owner' not in a
          assert 'CORE_AUDIO_INSERT' in d
          assert 'CORE_AUDIO_MUTE_VOICES' not in d
          assert 'CORE_MIDI_CC_AUTO' in d
          assert 'grain_armed' in d and 'GRAIN_ARM_FRAMES' in d
          assert 'GRAIN_DEFAULT       11520u' in d
          assert 'GRAIN_MAX_FRAMES    17280u' in d
          assert 'grain_frames_target' in d and 'pitch_choice' in d
          assert 'cc == 33 || cc == 34' in d and 'cc == 36' in d
          assert 'grain_begin(g, 0u)' in d and 'pitch_steps[8]' in d
          assert 'GRAIN_POSITION_MAX  3000u' in d
          assert 'HIST_FRAMES        131072u' in d
          assert 'GRAIN_MIN_FRAMES     5760u' in d
          assert 'GRAIN_RAMP_FRAMES    3840u' in d
          assert 'grain_hann_q15[256]' in d
          assert 'grain_window_step_q16' in d
          assert 'uint32_t fraction = pos * grain_speed[g];' in d
          assert 'fraction >> 12' in d
          assert 'wet[0] >>= 1;' in d and 'wet[1] >>= 1;' in d
          assert 'CORE_AUDIO_INSERT' in d

          assert 'GRAIN_ARM_FRAMES    90000u' in d
          assert 'if(cc == 37)' in d
          assert 'grain_position_target' in d
          assert 'E576_CC_GLITCH 40' in a
          assert 'E576_CC_STUTTER 65' in a
          assert 'E576_CC_SPEED 67' in a
          assert 'E576_CC_SCRUB 68' in a
          assert 'E576_CC_INVERT 69' in a
          assert 'eureka576_cc' in a
          assert 'if((flags&2)!=0) return 0;' in a
          assert 'fw_fillrect(bmp,0,0,127,63,0);' in a
          assert 'eureka576_yes_owned' in e
          assert 'if(key==E576_KEY_YES && eureka576_yes_owned && !(flags&1))' in e
          assert 'eureka576_yes_owned=1u;' in e
          assert 'eureka576_yes_owned=0u;' in e
          assert 'E576_MIDI_PENDING' in e
          assert 'E576_MIDI_VIDEO_CHORD' in e
          assert 'eureka576_stock_midi_down' in e
          assert 'E576_STOCK_KEYDISP' in e
          assert 'eureka576_midi_state==E576_MIDI_VIDEO_CHORD' in e
          assert 'E576_MIDI_PANEL_CHORD' in e
          assert 'eureka576_param_armed' in e
          assert 'eureka576_param_page' in e
          assert 'eureka576_toggle_pages' in e
          assert 'eureka576_draw_parameters' in e
          assert 'eureka576_enc(void *brain,void *ev)' in e
          assert 'E576_KEY_STEP1 26' in e and 'E576_KEY_STEP16 41' in e
          assert 'return 0; /* preserve all stock 1..16 trigger/key events */' in e
          assert 'if(eureka576_enabled && eureka576_param_armed &&' in e


          assert '#define E576_CLIP_FRAMES 36u' in e
          assert 'static int eureka576_random_scene(void)' in e
          assert 'eureka576_next_scene_cut' in e
          assert '8u+4u*(eureka576_random()%3u)' in e
          assert 'eureka576_index+1u>=base+span' in e
          assert 'eureka576_random_scene()' in e

          print('PASS: paired EUREKA YES down/up and stock MUTE event passthrough; audio MUTE NOT VERIFIED')

          assert 'delay_line' not in d and 'room_valid' not in d
          assert 'memset(' not in d and 'malloc(' not in d
          print('PASS: audio insert isolated from EUREKA display')
          PY
      - name: Preflight all four exclusive FX DSP and UI (host only)
        run: |
          set -euo pipefail
          gcc -DRACK_HOST_TEST -std=c11 -O1 -g -Wall -Wextra -Werror -Wconversion \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I ports/digitone_fx_rack \
            ports/digitone_fx_rack/rack_audio.c \
            ports/digitone_fx_rack/test_rack_audio.c -o /tmp/dn_rack_host_test
          /tmp/dn_rack_host_test
          rm /tmp/dn_rack_host_test
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('ports/digitone_fx_rack')
          j=json.loads((r/'mod.json').read_text())
          menu=[x for x in j['contribute'] if x['to']=='core_menu']
          audio=[x for x in j['contribute'] if x['to']=='core_audio']
          assert len(menu)==5 and len(audio)==1, 'one owner and five menu entries'
          assert j['resources']['regions'][0]['lo']=='0x47900000'
          assert j['resources']['regions'][0]['hi']=='0x47B00000'
          assert j['sources']==['granular.c','rack_audio.c','rack_ui.c','digitone_fx_pages.c']
          d=(r/'rack_audio.c').read_text()
          u=(r/'rack_ui.c').read_text()
          g=(r/'granular.c').read_text()
          p=(r/'digitone_fx_pages.c').read_text()
          assert 'struct core_audio_owner rack_owner={0,rack_render,CORE_AUDIO_INSERT};' in u
          assert 'rack_audio_render(out,in,active)' in u
          assert 'rack_granular_render(out,in)' in u
          assert 'haze_host_memory' in d and 'haze_primed' in d
          assert 'reel_frame' in d and 'crush_frame' in d and 'haze_frame' in d
          assert 'rack_granular_set' in g and 'rack_granular_cc' in g
          assert 'dnfx_page_count' in p and 'haze' not in j['id'].lower()
          assert 'KEY_STEP1' in u and 'KEY_STEP16' in u and 'return 0;' in u
          assert 'rack_fading' in u and 'rack_ramp' in u
          assert 'CORE_AUDIO_MUTE_VOICES' not in u
          assert 'void eureka576_draw' in Path('ports/digitone_eureka576/eureka576.c').read_text()
          assert 'workflow_dispatch:' in Path('.github/workflows/build-digitone-eureka576.yml').read_text()
          print('PASS: four FX descriptors, single master insert, video separation, source gates')
          PY
      - name: Preflight new FX rack UI and stereo DSP stress with sanitizers
        run: |
          set -euo pipefail
          RACK=ports/digitone_fx_rack
          COMMON='-DRACK_HOST_TEST -std=c11 -O1 -g -Wall -Wextra -Werror -Wconversion -fsanitize=address,undefined -fno-sanitize-recover=all'
          gcc $COMMON -I "$RACK" -I "$RACK/tests/include" \
            "$RACK/rack_ui.c" "$RACK/digitone_fx_pages.c" \
            "$RACK/rack_audio.c" "$RACK/granular.c" \
            "$RACK/tests/test_rack_ui.c" -o /tmp/digitone_rack_ui
          /tmp/digitone_rack_ui
          gcc $COMMON -I "$RACK" \
            "$RACK/rack_audio.c" "$RACK/tests/test_rack_stress.c" \
            -o /tmp/digitone_rack_stress
          /tmp/digitone_rack_stress
          rm /tmp/digitone_rack_ui /tmp/digitone_rack_stress
          echo 'PASS: linked UI/Granular, original keys preserved, 11.52M DSP samples UBSan+ASan'
      - name: Verify optimized DSP math against old PG80 output
        run: |
          set -euo pipefail
          RACK=ports/digitone_fx_rack
          gcc -DRACK_HOST_TEST -std=c11 -O1 -g -Wall -Wextra -Werror -Wconversion \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I "$RACK" "$RACK/tests/test_rack_cpu_lut.c" \
            -o /tmp/digitone_rack_cpu_lut
          /tmp/digitone_rack_cpu_lut
          rm /tmp/digitone_rack_cpu_lut
      - name: Obtain pinned elekloader and core
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.9.0 https://github.com/elekloader/elekloader.git _elekloader
          test "$(git -C _elekloader rev-parse HEAD)" = 'dc6ac1fd6792eeb3ab217b6ab2d6b73aa7aa30f6'
          curl -fL --retry 3 -o _firmware/core.elemod 'https://github.com/elekloader/elekloader/releases/download/v0.9.0/core-dn1-4.1.1-os1.44.elemod'
          echo '2b474537c4b9772ef79bd6dfc7218866146ec4ac02c55e77b1bb6078803befdf  _firmware/core.elemod' | sha256sum -c -
      - name: Build, lint, patch, verify
        run: |
          set -euo pipefail
          cd _elekloader
          python3 -m elekloader.sdk.build "$GITHUB_WORKSPACE/ports/digitone_eureka576" --stock "$GITHUB_WORKSPACE/_firmware/stock.syx"
          python3 -m elekloader.sdk.build "$GITHUB_WORKSPACE/ports/digitone_fx_rack" --stock "$GITHUB_WORKSPACE/_firmware/stock.syx"
          VISUAL_MOD="$GITHUB_WORKSPACE/ports/digitone_eureka576/out/eureka576-2.1.elemod"
          RACK_MOD="$GITHUB_WORKSPACE/ports/digitone_fx_rack/out/digitone-fx-rack-0.1.0.elemod"
          test -s "$VISUAL_MOD"
          test -s "$RACK_MOD"
          CORE="$GITHUB_WORKSPACE/_firmware/core.elemod"
          STOCK="$GITHUB_WORKSPACE/_firmware/stock.syx"
          python3 -m elekloader.lint "$VISUAL_MOD" --stock "$STOCK" --with "$CORE"
          python3 -m elekloader.lint "$RACK_MOD" --stock "$STOCK" --with "$CORE"
          python3 -m elekloader.lint "$VISUAL_MOD" "$RACK_MOD" --stock "$STOCK" --with "$CORE"
          python3 -m elekloader.patch --stock "$STOCK" --mod "$CORE" \
            --mod "$VISUAL_MOD" --mod "$RACK_MOD" --check
          mkdir -p "$GITHUB_WORKSPACE/_release"
          python3 -m elekloader.patch --stock "$STOCK" --mod "$CORE" \
            --mod "$VISUAL_MOD" --mod "$RACK_MOD" \
            --out "$GITHUB_WORKSPACE/_release/Digitone_OS1.44_FX_RACK_CPUFIX_USER_TILES_PG82_TRIAL.syx" \
            --version PG82
          (
            cd "$GITHUB_WORKSPACE/_release"
            sha256sum Digitone_OS1.44_FX_RACK_CPUFIX_USER_TILES_PG82_TRIAL.syx > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          cp "$VISUAL_MOD" "$RACK_MOD" "$GITHUB_WORKSPACE/_release/"
          cp "$GITHUB_WORKSPACE/ports/digitone_eureka576/eureka_lcd_preview.png" "$GITHUB_WORKSPACE/_release/"
          python3 "$GITHUB_WORKSPACE/ports/digitone_eureka576/tests/render_face_preview.py" \
            "$GITHUB_WORKSPACE/ports/digitone_eureka576/reference.bin" \
            "$GITHUB_WORKSPACE/_release/eureka_samples_8.png"
      - name: Upload build files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Digitone-OS1.44-FOUR-FX-USER-TILES-PG82-TRIAL
          path: _release/
          if-no-files-found: error
          retention-days: 30



